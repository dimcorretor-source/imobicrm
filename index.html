<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ImobiCRM</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#23291F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ImobiCRM">
<link rel="apple-touch-icon" href="icons/icon-96.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
:root{
  --paper:#F3EEE2;
  --paper-2:#EAE1CC;
  --paper-3:#FBF9F3;
  --ink:#23291F;
  --ink-soft:#5B5B4E;
  --verde:#2F5233;
  --verde-soft:#e3e9df;
  --vermelho:#8C2F2F;
  --vermelho-soft:#f3e3df;
  --latao:#9c7a3f;
  --latao-soft:#f1e6cf;
  --azul:#35566B;
  --azul-soft:#e1e8ec;
  --line:#C9C0AC;
  --radius:3px;
  --display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --mono: 'IBM Plex Mono', 'Courier New', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--body);
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
button, input, select, textarea{font-family:inherit;}
::selection{background:var(--latao-soft);}

a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--azul);
  outline-offset:2px;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}

#app{display:flex; min-height:100vh;}

/* ---------- GATE (login/perfil) ---------- */
.gate-wrap{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:var(--ink); padding:20px;
}
.gate-card{
  background:var(--paper-3); border-radius:var(--radius); padding:36px 34px; width:100%; max-width:440px;
  border:1px solid var(--line);
}
.gate-card h1{font-family:var(--display); font-size:24px; margin:0 0 4px 0;}
.gate-card p{font-size:13px; color:var(--ink-soft); margin:0 0 22px 0;}
.gate-user{
  display:flex; align-items:center; gap:12px; padding:11px 14px; border:1px solid var(--line);
  border-radius:var(--radius); margin-bottom:8px; cursor:pointer; background:var(--paper-3);
}
.gate-user:hover{border-color:var(--ink); background:var(--paper-2);}
.gate-avatar{
  width:36px; height:36px; border-radius:50%; background:var(--latao-soft); color:var(--latao);
  display:flex; align-items:center; justify-content:center; font-family:var(--display); font-weight:700; flex-shrink:0;
}
.gate-user b{font-size:13.5px;}
.gate-user .role{font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); display:block;}

/* ---------- SIDEBAR ---------- */
.sidebar{
  width:220px; flex-shrink:0; background:var(--ink); color:var(--paper);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
}
.sidebar-head{padding:22px 20px 14px 20px; border-bottom:1px solid rgba(243,238,224,0.14);}
.brand-row{display:flex; align-items:center; gap:10px;}
.brand-logo{
  width:34px; height:34px; border-radius:50%; background:var(--latao); color:var(--ink);
  display:flex; align-items:center; justify-content:center; font-family:var(--display); font-weight:700; font-size:15px;
  flex-shrink:0; overflow:hidden; border:1px solid rgba(0,0,0,0.15);
}
.brand-logo img{width:100%; height:100%; object-fit:cover;}
.brand-name{font-family:var(--display); font-weight:600; font-size:17px; letter-spacing:0.2px; line-height:1.15;}
.brand-sub{font-size:10.5px; color:#c9c3ae; letter-spacing:0.08em; text-transform:uppercase; margin-top:2px;}

.nav{padding:14px 10px; display:flex; flex-direction:column; gap:2px; flex:1; overflow-y:auto;}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:var(--radius);
  color:#d8d3c1; text-decoration:none; font-size:13.5px; font-weight:500; cursor:pointer;
  border:1px solid transparent; background:none; text-align:left; width:100%;
}
.nav-item:hover{background:rgba(243,238,224,0.08);}
.nav-item.active{background:var(--paper-3); color:var(--ink); border-color:rgba(0,0,0,0.05);}
.nav-icon{width:16px; text-align:center; font-size:14px;}
.nav-foot{padding:14px 18px; border-top:1px solid rgba(243,238,224,0.14); font-size:11px; color:#a39d87;}
.nav-user{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
.nav-user .gate-avatar{width:28px; height:28px; font-size:12px;}
.nav-user b{display:block; font-size:12px; color:var(--paper);}
.nav-foot button{
  background:none; border:1px solid rgba(243,238,224,0.25); color:#d8d3c1;
  border-radius:var(--radius); padding:6px 9px; font-size:11px; cursor:pointer; width:100%; margin-top:6px;
}
.nav-foot button:hover{background:rgba(243,238,224,0.1);}

/* ---------- MAIN ---------- */
.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  padding:18px 34px; border-bottom:1px solid var(--line); display:flex; align-items:center;
  justify-content:space-between; background:var(--paper-3);
}
.topbar-title{font-family:var(--display); font-size:24px; font-weight:600;}
.topbar-date{font-size:12px; color:var(--ink-soft); font-family:var(--mono); text-transform:capitalize;}
.content{padding:30px 34px 60px 34px; max-width:1180px;}

/* ---------- PRIMITIVES ---------- */
.card{background:var(--paper-3); border:1px solid var(--line); border-radius:var(--radius); padding:20px 22px;}
.grid{display:grid; gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}

.kpi-label{font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-soft); font-weight:600;}
.kpi-value{font-family:var(--display); font-size:30px; font-weight:600; margin-top:6px;}
.kpi-sub{font-size:11.5px; color:var(--ink-soft); margin-top:4px;}

.section-title{
  font-family:var(--display); font-size:18px; font-weight:600; margin:0 0 14px 0;
  display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
}
.section-block{margin-bottom:28px;}

.btn{
  font-size:12.5px; font-weight:600; padding:8px 14px; border-radius:var(--radius);
  border:1px solid var(--ink); background:var(--ink); color:var(--paper); cursor:pointer;
  display:inline-flex; align-items:center; gap:6px;
}
.btn:hover{opacity:0.85;}
.btn-outline{background:none; color:var(--ink); border:1px solid var(--line);}
.btn-outline:hover{background:var(--paper-2);}
.btn-danger{background:none; border:1px solid var(--vermelho); color:var(--vermelho);}
.btn-danger:hover{background:var(--vermelho-soft);}
.btn-sm{padding:5px 10px; font-size:11.5px;}

table{width:100%; border-collapse:collapse; font-size:13px;}
th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--ink);}
td{padding:10px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}
tr:hover td{background:var(--paper-2);}
.mono{font-family:var(--mono); font-size:12px;}
.tright{text-align:right;}

.empty{border:1px dashed var(--line); border-radius:var(--radius); padding:34px 20px; text-align:center; color:var(--ink-soft); font-size:13px;}
.empty b{color:var(--ink); display:block; font-family:var(--display); font-size:16px; margin-bottom:6px; font-weight:600;}

.stamp{
  display:inline-flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:10px;
  font-weight:600; letter-spacing:0.05em; text-transform:uppercase; padding:4px 10px; border-radius:20px;
  border:1.5px dashed currentColor; transform:rotate(-2deg); white-space:nowrap;
}
.stamp.s-latao{color:var(--latao); background:var(--latao-soft);}
.stamp.s-azul{color:var(--azul); background:var(--azul-soft);}
.stamp.s-verde{color:var(--verde); background:var(--verde-soft);}
.stamp.s-vermelho{color:var(--vermelho); background:var(--vermelho-soft);}
.stamp.s-ink{color:var(--ink-soft); background:var(--paper-2); border-style:solid;}

.priority-alta{color:var(--vermelho); font-weight:700;}

.pillbar{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; align-items:center;}
.pill{font-size:11.5px; padding:6px 12px; border-radius:20px; border:1px solid var(--line); background:var(--paper-3); cursor:pointer; color:var(--ink-soft);}
.pill.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}
.pillbar select{font-size:11.5px; padding:6px 10px; border-radius:20px; border:1px solid var(--line); background:var(--paper-3); color:var(--ink-soft);}

.kanban{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(108px,1fr); gap:6px; overflow-x:auto;}
.kcol{background:var(--paper-2); border-radius:var(--radius); padding:7px; min-width:108px; min-height:80px; transition:background 0.15s;}
.kcol.dragover{background:var(--azul-soft); outline:2px dashed var(--azul);}
.kcol h4{font-size:11px; text-transform:uppercase; letter-spacing:0.05em; margin:0 0 8px 2px; color:var(--ink-soft);}
.kcard{background:var(--paper-3); border:1px solid var(--line); border-radius:var(--radius); padding:6px 7px; margin-bottom:6px; font-size:11.5px; cursor:grab; overflow-wrap:break-word;}
.kcard:hover{border-color:var(--ink);}
.kcard.dragging{opacity:0.4;}
.kcard b{display:block; font-size:12.5px; margin-bottom:2px;}

.imoveis-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px;}
.imovel-card{border:1px solid var(--line); border-radius:var(--radius); background:var(--paper-3); padding:14px; cursor:pointer; position:relative;}
.imovel-card:hover{border-color:var(--ink);}
.imovel-code{font-family:var(--mono); font-size:11px; color:var(--ink-soft);}
.imovel-title{font-family:var(--display); font-size:16px; font-weight:600; margin:4px 0 2px 0;}
.imovel-price{font-family:var(--mono); font-weight:600; font-size:14px; margin-top:8px;}
.star{position:absolute; top:12px; right:12px; color:var(--latao); font-size:15px;}
.imovel-thumb{width:100%; height:110px; object-fit:cover; border-radius:var(--radius); margin-bottom:8px; background:var(--paper-2);}

/* Modal */
.modal-overlay{position:fixed; inset:0; background:rgba(35,41,31,0.55); display:flex; align-items:flex-start; justify-content:center; padding:5vh 20px; overflow-y:auto; z-index:100;}
.modal{background:var(--paper-3); border-radius:var(--radius); width:100%; max-width:560px; padding:26px 28px; border:1px solid var(--line); position:relative;}
.modal.wide{max-width:760px;}
.modal h3{font-family:var(--display); font-size:19px; margin:0 0 16px 0; font-weight:600;}
.field{margin-bottom:12px;}
.field label{display:block; font-size:11.5px; font-weight:600; color:var(--ink-soft); margin-bottom:4px; text-transform:uppercase; letter-spacing:0.04em;}
.field input, .field select, .field textarea{width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:var(--radius); background:var(--paper-3); font-size:13px; color:var(--ink);}
.field input[type=color]{padding:3px; height:38px; cursor:pointer;}
.field textarea{resize:vertical; min-height:60px;}
.modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:18px; flex-wrap:wrap;}
.modal-close{position:absolute; top:14px; right:16px;}

.timeline{list-style:none; margin:0; padding:0;}
.timeline li{padding:8px 0; border-bottom:1px solid var(--line); font-size:12.5px;}
.timeline li span{color:var(--ink-soft); font-family:var(--mono); font-size:11px; display:block;}

.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:var(--radius); font-size:12.5px; z-index:200; opacity:0; pointer-events:none; transition:opacity 0.25s ease;}
.toast.show{opacity:1;}

.logo-edit-wrap{display:flex; align-items:center; gap:12px;}
.logo-preview{width:64px; height:64px; border-radius:50%; overflow:hidden; border:1px solid var(--line); background:var(--paper-2); display:flex; align-items:center; justify-content:center; font-family:var(--display); font-size:22px; color:var(--latao); font-weight:700;}
.logo-preview img{width:100%; height:100%; object-fit:cover;}

.color-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}

.photo-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(80px,1fr)); gap:8px; margin:10px 0;}
.photo-thumb{position:relative; border-radius:var(--radius); overflow:hidden; border:1px solid var(--line); aspect-ratio:1;}
.photo-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
.photo-thumb button{position:absolute; top:2px; right:2px; background:rgba(35,41,31,0.75); color:#fff; border:none; border-radius:50%; width:18px; height:18px; font-size:11px; line-height:1; cursor:pointer;}

.ficha-content{background:#fff; color:#1c1c1c;}
.ficha-header{display:flex; align-items:center; gap:14px; border-bottom:2px solid #23291F; padding-bottom:14px; margin-bottom:18px;}
.ficha-header .logo{width:48px; height:48px; border-radius:50%; overflow:hidden; flex-shrink:0; background:#eee;}
.ficha-header .logo img{width:100%; height:100%; object-fit:cover;}
.ficha-title{font-family:var(--display); font-size:22px; font-weight:700;}
.ficha-sub{font-size:11px; color:#666; font-family:var(--mono);}
.ficha-grid{display:grid; grid-template-columns:1fr 1fr; gap:6px 24px; font-size:12.5px; margin-bottom:16px;}
.ficha-grid div b{display:block; font-size:10px; text-transform:uppercase; letter-spacing:0.05em; color:#777; font-weight:600;}
.ficha-photos{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:14px 0;}
.ficha-photos img{width:100%; height:130px; object-fit:cover; border-radius:2px;}
.ficha-footer{margin-top:20px; padding-top:12px; border-top:1px solid #ccc; font-size:10.5px; color:#777;}

.hamburger{display:none; background:none; border:1px solid var(--line); border-radius:var(--radius); width:34px; height:34px; align-items:center; justify-content:center; font-size:16px; cursor:pointer; color:var(--ink); flex-shrink:0;}
.table-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
.gcal-link{font-size:11px; text-decoration:none; color:var(--azul); border:1px solid var(--azul); border-radius:var(--radius); padding:5px 8px; white-space:nowrap;}
.gcal-link:hover{background:var(--azul-soft);}
.sidebar-backdrop{display:none;}

@media (max-width:860px){
  .hamburger{display:flex;}
  .sidebar{
    position:fixed; left:0; top:0; height:100vh; z-index:150;
    transform:translateX(-100%); transition:transform 0.22s ease; width:240px;
  }
  .sidebar.open{transform:translateX(0);}
  .sidebar-backdrop{
    display:none; position:fixed; inset:0; background:rgba(35,41,31,0.5); z-index:140;
  }
  .sidebar-backdrop.open{display:block;}
  .main{width:100%;}
  .topbar{padding:14px 16px; gap:10px;}
  .topbar-title{font-size:19px;}
  .topbar-date{display:none;}
  .content{padding:18px 16px 50px 16px;}
  .grid-4, .grid-3, .grid-2{grid-template-columns:1fr 1fr;}
  .kpi-value{font-size:24px;}
  .imoveis-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
  .modal{padding:20px 16px; max-width:100%;}
  .field-row{grid-template-columns:1fr;}
  .kanban{grid-auto-columns:220px;}
  table{font-size:12px;}
  th, td{padding:8px 6px;}
  .field input, .field select, .field textarea{font-size:16px; padding:10px 11px;}
  .btn, .btn-outline, .btn-danger{padding:9px 14px; font-size:13px;}
  .btn-sm{padding:8px 12px; font-size:12.5px;}
  .pill{padding:8px 14px;}
  .nav-item{padding:11px 12px;}
}
@media (max-width:480px){
  .grid-4, .grid-3, .grid-2{grid-template-columns:1fr;}
  .color-grid{grid-template-columns:1fr 1fr;}
}

@media print{
  .sidebar, .topbar, .btn, .no-print, .hamburger, .sidebar-backdrop{display:none !important;}
  .main{width:100%;}
  body{background:#fff;}
  .modal-overlay{position:static !important; background:#fff !important; padding:0 !important; display:block !important;}
  .modal{box-shadow:none !important; border:none !important; max-width:100% !important; padding:0 !important;}
}
</style>
</head>
<body>

<div id="gateRoot"></div>
<div id="app" style="display:none;">
  <aside class="sidebar">
    <div class="sidebar-head">
      <div class="brand-row">
        <div class="brand-logo" id="sidebarLogo">IC</div>
        <div>
          <div class="brand-name" id="sidebarName">ImobiCRM</div>
          <div class="brand-sub" id="sidebarSub">Corretor</div>
        </div>
      </div>
    </div>
    <nav class="nav" id="navList"></nav>
    <div class="nav-foot">
      <div class="nav-user" id="navUser"></div>
      <button id="btnTrocarUsuario">↺ Sair</button>
      Dados salvos neste navegador.
      <div id="sidebarExportImportWrap">
        <button id="btnExport">⇩ Exportar dados (.json)</button>
        <button id="btnImport">⇧ Importar dados</button>
      </div>
      <input type="file" id="fileImport" accept="application/json" style="display:none">
    </div>
  </aside>

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <div class="main">
    <header class="topbar">
      <button class="hamburger" id="hamburgerBtn">☰</button>
      <div class="topbar-title" id="pageTitle">Painel</div>
      <div class="topbar-date" id="todayDate"></div>
    </header>
    <div class="content" id="content"></div>
  </div>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   SUPABASE — cliente e sincronização
============================================================ */
const sb = (typeof SUPABASE_URL !== 'undefined' && SUPABASE_URL && !SUPABASE_URL.startsWith('COLE_AQUI'))
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

function defaultTheme(){
  return { paper:'#F3EEE2', ink:'#23291F', verde:'#2F5233', vermelho:'#8C2F2F', latao:'#9c7a3f', azul:'#35566B' };
}
function defaultState(){
  return {
    config: { nome: 'ImobiCRM', logo: null, subtitulo: 'Corretor', cidades: 'Mogi Mirim, Holambra e Piracicaba', meta: 30000, theme: defaultTheme() },
    roletaConfig: { participantes: [], ativa: true, prazoMinutos: 20 },
    usuarios: [], produtos: [], imobiliarias: [],
    leads: [], clientes: [], imoveis: [], compromissos: [], comissoes: [], despesas: [], receitas: []
  };
}
let state = defaultState();
let sessionUser = null;
let currentProfile = null;

function uid(){ return 'id-' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}

/* ---------- mapeamento linha do banco <-> objeto local ---------- */
function rowToLead(r){ return { id:r.id, nome:r.nome, telefone:r.telefone, email:r.email, origem:r.origem, tipo:r.tipo, orcamento:r.orcamento, bairrosInteresse:r.bairros_interesse, tipoImovelDesejado:r.tipo_imovel_desejado, imovelInteresseId:r.imovel_interesse_id, produtoId:r.produto_id, consentimento:!!r.consentimento, observacoes:r.observacoes, status:r.status, dataCriacao:r.data_criacao, ultimoContato:r.ultimo_contato, interacoes:r.interacoes||[], corretorId:r.corretor_id, roletaStatus:r.roleta_status, roletaPrazo:r.roleta_prazo, roletaAtribuidoEm:r.roleta_atribuido_em }; }

async function pullAllData(){
  const [leadsR, clientesR, imoveisR, compR, comisR, despR, recR, profR, cfgR, prodR, imobR, roletaR] = await Promise.all([
    sb.from('leads').select('*'), sb.from('clientes').select('*'), sb.from('imoveis').select('*'),
    sb.from('compromissos').select('*'), sb.from('comissoes').select('*'), sb.from('despesas').select('*'),
    sb.from('receitas').select('*'), sb.from('profiles').select('*'), sb.from('config').select('*').eq('id',1).maybeSingle(),
    sb.from('produtos').select('*'), sb.from('imobiliarias').select('*'), sb.from('roleta_config').select('*').eq('id','default').maybeSingle()
  ]);
  state.leads = (leadsR.data||[]).map(rowToLead);
  state.clientes = (clientesR.data||[]).map(rowToCliente);
  state.imoveis = (imoveisR.data||[]).map(rowToImovel);
  state.compromissos = (compR.data||[]).map(rowToComp);
  state.comissoes = (comisR.data||[]).map(rowToComissao);
  state.despesas = (despR.data||[]).map(rowToDespesa);
  state.receitas = (recR.data||[]).map(rowToReceita);
  state.usuarios = (profR.data||[]).map(p=>({id:p.id, nome:p.nome, papel:p.papel, telefone:p.telefone, creci:p.creci, imobiliariaId:p.imobiliaria_id, disponivelRoleta:!!p.disponivel_roleta, avatarUrl:p.avatar_url||null}));
  state.produtos = (prodR.data||[]).map(rowToProduto);
  state.imobiliarias = (imobR.data||[]).map(rowToImobiliaria);
  if(roletaR.data){
    state.roletaConfig = { participantes: roletaR.data.participantes||[], ativa: !!roletaR.data.ativa, prazoMinutos: roletaR.data.prazo_minutos||20 };
  }
  if(cfgR.data){
    state.config = { nome: cfgR.data.nome||'ImobiCRM', logo: cfgR.data.logo||null, subtitulo: cfgR.data.subtitulo!=null?cfgR.data.subtitulo:'Corretor', cidades: cfgR.data.cidades||'', meta: cfgR.data.meta||0, theme: Object.assign(defaultTheme(), cfgR.data.theme||{}) };
  }
  currentProfile = state.usuarios.find(u=>u.id===sessionUser.id) || {id:sessionUser.id, nome:sessionUser.email, papel:'Corretor'};
}

/* ---------- gravar tudo de volta (upsert em lote) ---------- */
async function syncTable(table, rows, mapFn){
  if(!rows.length) return;
  const { error } = await sb.from(table).upsert(rows.map(mapFn), {onConflict:'id'});
  if(error) console.error('Erro ao sincronizar '+table, error);
}
async function syncToSupabase(){
  if(!sb || !currentProfile) return;
  try{
    await Promise.all([
      syncTable('leads', state.leads, leadToRow), syncTable('clientes', state.clientes, clienteToRow),
      syncTable('imoveis', state.imoveis, imovelToRow), syncTable('compromissos', state.compromissos, compToRow),
      syncTable('comissoes', state.comissoes, comissaoToRow), syncTable('despesas', state.despesas, despesaToRow),
      syncTable('receitas', state.receitas, receitaToRow)
    ]);
    if(isGestor()){
      await syncTable('produtos', state.produtos, produtoToRow);
      await syncTable('imobiliarias', state.imobiliarias, imobiliariaToRow);
      await sb.from('config').upsert([{ id:1, nome: state.config.nome, logo: state.config.logo, subtitulo: state.config.subtitulo, cidades: state.config.cidades, meta: state.config.meta, theme: state.config.theme }], {onConflict:'id'});
    }
  }catch(e){ console.error('Erro ao sincronizar com o Supabase', e); }
}
function save(){
  try{ localStorage.setItem('imobicrm_cache_v1', JSON.stringify(state)); }catch(e){}
  syncToSupabase();
}

function fmtMoney(n){ n = Number(n)||0; return n.toLocaleString('pt-BR', {style:'currency', currency:'BRL'}); }
function fmtDate(d){ if(!d) return '—'; const [y,m,day] = d.split('-'); if(!y) return d; return `${day}/${m}/${y}`; }
function todayISO(){ return new Date().toISOString().slice(0,10); }

/* Link "Adicionar ao Google Agenda" (sem necessidade de login/OAuth — abre o formulário pronto do Google) */
function gcalUrl(cm){
  const pad = n=>String(n).padStart(2,'0');
  let datesParam;
  if(cm.hora){
    const start = new Date(`${cm.data}T${cm.hora}:00`);
    const end = new Date(start.getTime() + 60*60000);
    const f = dt => `${dt.getFullYear()}${pad(dt.getMonth()+1)}${pad(dt.getDate())}T${pad(dt.getHours())}${pad(dt.getMinutes())}00`;
    datesParam = `${f(start)}/${f(end)}`;
  }else{
    const d = new Date(cm.data+'T00:00:00');
    const d2 = new Date(d.getTime()+86400000);
    const f = dt => `${dt.getFullYear()}${pad(dt.getMonth()+1)}${pad(dt.getDate())}`;
    datesParam = `${f(d)}/${f(d2)}`;
  }
  const params = new URLSearchParams({ action:'TEMPLATE', text: cm.titulo||'Compromisso', dates: datesParam, details: cm.descricao||'' });
  return `https://calendar.google.com/calendar/render?${params.toString()}`;
}

============================================================ */
function hexToRgb(hex){
  hex = hex.replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const num = parseInt(hex,16);
  return {r:(num>>16)&255, g:(num>>8)&255, b:num&255};
}
function rgbToHex(r,g,b){
  return '#' + [r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
}
function mix(hexA, hexB, weightB){
  const a = hexToRgb(hexA), b = hexToRgb(hexB);
  return rgbToHex(a.r+(b.r-a.r)*weightB, a.g+(b.g-a.g)*weightB, a.b+(b.b-a.b)*weightB);
}
function applyTheme(){
  const t = state.config.theme || defaultTheme();
  const root = document.documentElement.style;
  root.setProperty('--paper', t.paper);
  root.setProperty('--paper-2', mix(t.paper, '#000000', 0.06));
  root.setProperty('--paper-3', mix(t.paper, '#ffffff', 0.6));
  root.setProperty('--ink', t.ink);
  root.setProperty('--ink-soft', mix(t.ink, t.paper, 0.45));
  root.setProperty('--line', mix(t.paper, t.ink, 0.25));
  root.setProperty('--verde', t.verde);
  root.setProperty('--verde-soft', mix(t.verde, '#ffffff', 0.85));
  root.setProperty('--vermelho', t.vermelho);
  root.setProperty('--vermelho-soft', mix(t.vermelho, '#ffffff', 0.85));
  root.setProperty('--latao', t.latao);
  root.setProperty('--latao-soft', mix(t.latao, '#ffffff', 0.85));
  root.setProperty('--azul', t.azul);
  root.setProperty('--azul-soft', mix(t.azul, '#ffffff', 0.85));
}

function currentUser(){ return currentProfile; }
function isGestor(){ return !!currentProfile && currentProfile.papel === 'Gestor'; }
function isGerente(){ return !!currentProfile && currentProfile.papel === 'Gerente'; }
function canManageTeam(){ return isGestor() || isGerente(); }
/* ids de todos os corretores/gerentes da mesma imobiliária do usuário atual (inclui ele mesmo) */
function teamMemberIds(){
  if(!currentProfile) return [];
  return state.usuarios.filter(u=>u.imobiliariaId && u.imobiliariaId===currentProfile.imobiliariaId).map(u=>u.id);
}
function scoped(arr){
  if(!currentProfile) return [];
  if(currentProfile.papel==='Gestor') return arr;
  if(currentProfile.papel==='Gerente'){
    const ids = teamMemberIds();
    return arr.filter(x=>ids.includes(x.corretorId));
  }
  return arr.filter(x=>x.corretorId===currentProfile.id);
}
function imobiliariaNome(id){
  const m = state.imobiliarias.find(x=>x.id===id);
  return m ? m.nome : '—';
}
function corretorNome(id){
  const u = state.usuarios.find(x=>x.id===id);
  return u ? u.nome : '—';
}

function renderGate(mode){
  document.getElementById('app').style.display = 'none';
  const gateRoot = document.getElementById('gateRoot');

  if(!sb){
    gateRoot.innerHTML = `
      <div class="gate-wrap"><div class="gate-card">
        <h1>Configuração pendente</h1>
        <p>Este site ainda não está conectado ao banco de dados. Abra o arquivo <b>config.js</b> e cole a URL e a chave "anon public" do seu projeto Supabase (veja o guia DEPLOY.md).</p>
      </div></div>`;
    return;
  }

  if(mode === 'recovery'){
    gateRoot.innerHTML = `
      <div class="gate-wrap"><div class="gate-card">
        <h1>Defina sua nova senha</h1>
        <p>Escolha uma senha para acessar o ${state.config.nome||'ImobiCRM'}.</p>
        <div class="field"><label>Nova senha</label><input type="password" id="recoveryPw" minlength="6"></div>
        <button class="btn" id="recoverySalvar" style="width:100%; justify-content:center;">Salvar senha e entrar</button>
        <p id="gateError" style="color:var(--vermelho); font-size:12.5px; margin-top:10px;"></p>
      </div></div>`;
    document.getElementById('recoverySalvar').addEventListener('click', async ()=>{
      const pw = document.getElementById('recoveryPw').value;
      if(!pw || pw.length<6){ document.getElementById('gateError').textContent = 'A senha precisa ter pelo menos 6 caracteres.'; return; }
      const { error } = await sb.auth.updateUser({ password: pw });
      if(error){ document.getElementById('gateError').textContent = error.message; return; }
      toast('Senha definida com sucesso.');
      await startSession();
    });
    return;
  }

  gateRoot.innerHTML = `
    <div class="gate-wrap"><div class="gate-card">
      <h1>${state.config.nome||'ImobiCRM'}</h1>
      <p>Entre com o e-mail e a senha que você recebeu por convite.</p>
      <div class="field"><label>E-mail</label><input type="email" id="gateEmail"></div>
      <div class="field"><label>Senha</label><input type="password" id="gatePw"></div>
      <button class="btn" id="gateEntrar" style="width:100%; justify-content:center;">Entrar</button>
      <p style="text-align:center; margin-top:12px;"><a href="#" id="gateEsqueci" style="font-size:12px; color:var(--azul);">Esqueci minha senha</a></p>
      <p id="gateError" style="color:var(--vermelho); font-size:12.5px; margin-top:6px;"></p>
    </div></div>
  `;
  document.getElementById('gateEntrar').addEventListener('click', async ()=>{
    const email = document.getElementById('gateEmail').value.trim();
    const password = document.getElementById('gatePw').value;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ document.getElementById('gateError').textContent = 'E-mail ou senha inválidos.'; return; }
    await startSession();
  });
  document.getElementById('gateEsqueci').addEventListener('click', async (e)=>{
    e.preventDefault();
    const email = prompt('Digite seu e-mail cadastrado para receber o link de redefinição de senha:');
    if(!email) return;
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.href });
    if(error){ alert('Não consegui enviar: ' + error.message); return; }
    alert('Se esse e-mail estiver cadastrado, um link de redefinição foi enviado.');
  });
}

/* ---------- Lembretes dentro do app (funciona enquanto a aba estiver aberta) ---------- */
let __remindersStarted = false;
let __notifiedIds = new Set();
let __notifiedRoletaIds = new Set();
function startReminderLoop(){
  if(__remindersStarted) return;
  __remindersStarted = true;
  setInterval(async ()=>{ await refreshLeadsFromServer(); checkReminders(); }, 30000);
  checkReminders();
  if('Notification' in window && Notification.permission==='granted') subscribeToPush();
}

/* ---------- Notificação push de verdade (chega mesmo com o app fechado, via servidor) ---------- */
function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for(let i=0; i<rawData.length; i++) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}
async function subscribeToPush(){
  if(!sb || !currentProfile) return;
  if(!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  if(typeof VAPID_PUBLIC_KEY === 'undefined' || !VAPID_PUBLIC_KEY) return;
  try{
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    const raw = sub.toJSON();
    await sb.from('push_subscriptions').upsert([{
      id: 'sub-' + currentProfile.id + '-' + Math.abs(hashCode(raw.endpoint)),
      corretor_id: currentProfile.id,
      endpoint: raw.endpoint,
      p256dh: raw.keys.p256dh,
      auth: raw.keys.auth
    }], {onConflict:'endpoint'});
  }catch(e){ console.error('Erro ao ativar notificações push', e); }
}
function hashCode(str){
  let h = 0;
  for(let i=0; i<str.length; i++){ h = ((h<<5)-h) + str.charCodeAt(i); h |= 0; }
  return h;
}
function requestNotifPermission(){
  if(!('Notification' in window)){ alert('Este navegador não suporta notificações.'); return; }
  Notification.requestPermission().then(p=>{
    if(p==='granted'){ toast('Notificações ativadas!'); subscribeToPush(); }
    else if(p==='denied') alert('As notificações foram bloqueadas no navegador. Para ativar, mude a permissão de notificação deste site nas configurações do navegador.');
  });
}
function checkReminders(){
  if(!currentProfile) return;
  const now = new Date();
  scoped(state.compromissos).filter(cm=>cm.status==='Pendente').forEach(cm=>{
    if(!cm.data || !cm.hora || __notifiedIds.has(cm.id)) return;
    const when = new Date(`${cm.data}T${cm.hora}:00`);
    const diffMin = (when - now) / 60000;
    if(diffMin <= 0 && diffMin >= -30){
      __notifiedIds.add(cm.id);
      const titulo = `⏰ ${cm.titulo}`;
      const corpo = `${cm.tipo} agendado para agora` + (cm.descricao?` — ${cm.descricao}`:'');
      if('Notification' in window && Notification.permission==='granted'){
        try{ new Notification(titulo, {body: corpo}); }catch(e){}
      }
      toast(titulo + ': ' + corpo);
    }
  });
  state.leads.filter(l=>l.corretorId===currentProfile.id && l.roletaStatus==='aguardando').forEach(l=>{
    if(__notifiedRoletaIds.has(l.id)) return;
    __notifiedRoletaIds.add(l.id);
    const titulo = `🎯 Novo lead da roleta: ${l.nome}`;
    const corpo = `Você tem ${state.roletaConfig.prazoMinutos} min para atender antes de passar para o próximo corretor.`;
    if('Notification' in window && Notification.permission==='granted'){
      try{ new Notification(titulo, {body: corpo}); }catch(e){}
    }
    toast(titulo);
  });
}

async function startSession(){
  const { data } = await sb.auth.getSession();
  if(!data.session){ renderGate(); return; }
  sessionUser = data.session.user;
  await pullAllData();
  applyTheme();
  document.getElementById('gateRoot').innerHTML = '';
  document.getElementById('app').style.display = 'flex';
  renderAll();
  startReminderLoop();
}

async function boot(){
  if(!sb){ renderGate(); return; }
  const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  const linkType = hashParams.get('type'); // 'invite' | 'recovery' | null
  sb.auth.onAuthStateChange((event, session)=>{
    if(event === 'PASSWORD_RECOVERY'){ renderGate('recovery'); }
    if(event === 'SIGNED_OUT'){ sessionUser=null; currentProfile=null; state=defaultState(); renderGate(); }
  });
  const { data } = await sb.auth.getSession();
  if(linkType){
    history.replaceState(null, '', window.location.pathname + window.location.search);
  }
  if(data.session){
    sessionUser = data.session.user;
    if(linkType === 'invite' || linkType === 'recovery'){
      // Veio de um link de convite ou redefinição de senha: sempre pedir para criar a senha antes de entrar.
      applyTheme();
      renderGate('recovery');
      return;
    }
    await pullAllData();
    applyTheme();
    document.getElementById('gateRoot').innerHTML = '';
    document.getElementById('app').style.display = 'flex';
    renderAll();
    startReminderLoop();
  }else{
    applyTheme();
    renderGate();
  }
}

// Retorna o motivo da pendência ({tipo, dias}) ou null se o lead estiver com uma próxima ação agendada em dia.
// Regra: todo lead precisa ter um próximo compromisso agendado (futuro). Sem isso, é pendência na hora — não espera dias.
function leadPendenciaInfo(lead){
  if(['Fechou','Perdido','Remarketing'].includes(lead.status)) return null;
  const hoje = todayISO();
  const agoraHora = new Date().toTimeString().slice(0,5);
  const compsDoLead = state.compromissos.filter(cm=>cm.leadId===lead.id && cm.status==='Pendente');
  const proximoFuturo = compsDoLead.find(cm=>cm.data > hoje || (cm.data===hoje && cm.hora > agoraHora));
  if(proximoFuturo) return null; // tem próxima ação agendada e ainda não venceu — está em dia

  const compVencido = compsDoLead.find(cm=>cm.data < hoje || (cm.data===hoje && cm.hora <= agoraHora));
  if(compVencido) return {tipo:'agendamento vencido', dias: daysBetween(compVencido.data, hoje)};

  // Nunca teve nenhum agendamento registrado — pendência imediata
  const ref = lead.ultimoContato || lead.dataCriacao;
  return {tipo:'sem agendamento', dias: daysBetween(ref, hoje)};
}
// Texto amigável do tempo sem interação (dias/semanas/meses/anos)
function tempoSemInteracaoTexto(lead){
  const ref = lead.ultimoContato || lead.dataCriacao;
  const dias = daysBetween(ref, todayISO());
  if(dias <= 0) return 'hoje';
  if(dias === 1) return '1 dia';
  if(dias < 14) return `${dias} dias`;
  if(dias < 60) return `${Math.floor(dias/7)} semanas`;
  if(dias < 730) return `${Math.floor(dias/30)} meses`;
  return `${Math.floor(dias/365)} anos`;
}

function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

function openModal({title, schema, data={}, onSave, extraHtml='', wide=false}){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-overlay" id="overlay">
      <div class="modal ${wide?'wide':''}">
        <button class="btn-sm btn-outline modal-close" id="modalCloseBtn">Fechar</button>
        <h3>${title}</h3>
        <div id="formFields"></div>
        ${extraHtml}
        <div class="modal-actions">
          <button class="btn btn-outline" id="modalCancel">Cancelar</button>
          <button class="btn" id="modalSave">Salvar</button>
        </div>
      </div>
    </div>
  `;
  const fieldsRoot = document.getElementById('formFields');
  fieldsRoot.innerHTML = buildFormFields(schema, data);

  document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeModal(); });
  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('modalSave').addEventListener('click', ()=>{
    const result = readFormFields(schema);
    onSave(result);
  });
}

function buildFormFields(schema, data){
  return schema.map(f=>{
    const val = data[f.key] !== undefined && data[f.key] !== null ? data[f.key] : (f.default!==undefined?f.default:'');
    if(f.type==='select'){
      return `<div class="field"><label>${f.label}</label><select id="ff_${f.key}">
        ${f.options.map(o=>`<option value="${o}" ${o===val?'selected':''}>${o}</option>`).join('')}
      </select></div>`;
    }
    if(f.type==='textarea'){
      return `<div class="field"><label>${f.label}</label><textarea id="ff_${f.key}">${val||''}</textarea></div>`;
    }
    if(f.type==='color'){
      return `<div class="field"><label>${f.label}</label><input type="color" id="ff_${f.key}" value="${val||'#000000'}"></div>`;
    }
    return `<div class="field"><label>${f.label}</label><input type="${f.type||'text'}" id="ff_${f.key}" value="${val!==undefined?val:''}" ${f.step?`step="${f.step}"`:''}></div>`;
  }).join('');
}

function readFormFields(schema){
  const out = {};
  schema.forEach(f=>{
    const el = document.getElementById('ff_'+f.key);
    if(!el) return;
    let v = el.value;
    if(f.type==='number') v = parseFloat(v)||0;
    out[f.key] = v;
  });
  return out;
}

function buildAlertas(){
  const hoje = todayISO();
  const compromissos = scoped(state.compromissos);
  const leads = scoped(state.leads);
  const clientes = scoped(state.clientes);
  const compHoje = compromissos.filter(cm=>cm.data===hoje && cm.status==='Pendente');
  const followups = leads.filter(l=>{
    if(l.status!=='Em Contato') return false;
    const ref = l.ultimoContato || l.dataCriacao;
    return daysBetween(ref, hoje) > 7;
  });
  const imoveisParados = state.imoveis.filter(i=>{
    if(i.status!=='Disponível') return false;
    return daysBetween(i.dataCriacao||hoje, hoje) >= 30 && (i.visitas||0)===0;
  });
  const items = [];
  if(compHoje.length) items.push(`📅 Você tem <b>${compHoje.length}</b> compromisso(s) hoje.`);
  if(followups.length) items.push(`⏱ <b>${followups.length}</b> lead(s) sem contato há mais de 7 dias — vale um follow-up.`);
  if(imoveisParados.length) items.push(`🏠 <b>${imoveisParados.length}</b> imóvel(is) disponível(is) há 30+ dias sem visita.`);
  const mesAtual = new Date().getMonth();
  const aniversariantes = clientes.filter(c=>c.dataNascimento && new Date(c.dataNascimento+'T00:00:00').getMonth()===mesAtual);
  if(aniversariantes.length) items.push(`🎂 <b>${aniversariantes.length}</b> cliente(s) fazem aniversário este mês.`);
  if(!items.length) return '';
  return `<div class="card section-block" style="border-left:3px solid var(--latao);">${items.map(i=>`<div style="font-size:13px; margin-bottom:4px;">${i}</div>`).join('')}</div>`;
}

function emptyState(title, sub){ return `<div class="empty"><b>${title}</b>${sub}</div>`; }

function stamp(status){
  const map = {
    'Novo':'s-latao','Em Contato':'s-azul','Agendou Visita':'s-azul','Visitou':'s-verde',
    'Negociando':'s-latao','Fechou':'s-verde','Remarketing':'s-azul','Perdido':'s-vermelho',
    'Disponível':'s-verde','Reservado':'s-latao','Vendido':'s-ink','Locado':'s-ink','Em Negociação':'s-azul',
    'Pendente':'s-latao','Concluído':'s-verde','Cancelado':'s-vermelho',
    'Recebido':'s-verde','A receber':'s-latao','Ativo':'s-verde','Inativo':'s-ink'
  };
  return `<span class="stamp ${map[status]||'s-ink'}">${status}</span>`;
}

/* Selo de tempo restante para atendimento de leads vindos da roleta */
function roletaBadgeHtml(lead){
  if(lead.roletaStatus !== 'aguardando' || !lead.roletaPrazo) return '';
  const restanteMin = Math.round((new Date(lead.roletaPrazo) - new Date()) / 60000);
  if(restanteMin <= 0) return `<span class="stamp s-vermelho" title="Prazo estourado, será reatribuído">⟲ reatribuindo…</span>`;
  return `<span class="stamp ${restanteMin<=5?'s-vermelho':'s-azul'}" title="Tempo para atender antes de passar para o próximo da roleta">⟲ ${restanteMin} min</span>`;
}

    {key:'imovelCodigo', label:'Lote de interesse (opcional)', type:'select', options:['(nenhum)', ...state.imoveis.map(i=>i.codigo)]},
    {key:'observacoes', label:'Observações', type:'textarea'}
  ];
  if(canManageTeam()){
    const opts = isGestor() ? state.usuarios.map(u=>u.nome) : state.usuarios.filter(u=>teamMemberIds().includes(u.id)).map(u=>u.nome);
    base.push({key:'corretorNome', label:'Corretor responsável', type:'select', options: opts});
  }
  return base;
}

let leadFilter = 'Todos';
let leadView = 'lista';
let leadCorretorFilter = 'Todos';
let leadSelectMode = false;
let leadSelected = new Set();

function renderLeads(){
  const c = document.getElementById('content');
  c.innerHTML = `
    <div class="section-title">
      <span>Leads</span>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        ${canManageTeam() && leadSelectMode && leadSelected.size ? `<button class="btn btn-sm" id="btnTransferirLeads">↪ Transferir para... (${leadSelected.size})</button>` : ''}
        ${canManageTeam() && leadSelectMode && leadSelected.size && leadFilter==='Remarketing' ? `<button class="btn btn-sm" id="btnEnviarRemarketing">📨 Enviar mensagem (${leadSelected.size})</button>` : ''}
        ${canManageTeam() ? `<button class="btn btn-outline btn-sm" id="btnSelecionarLeads">${leadSelectMode ? 'Cancelar seleção' : '☑ Selecionar'}</button>` : ''}
        ${canManageTeam() ? `<button class="btn btn-outline btn-sm" id="btnIrRemarketing">📨 Remarketing</button>` : ''}
        <button class="btn btn-outline btn-sm" id="toggleKanban">${leadView==='lista'?'⊞ Ver kanban':'≡ Ver lista'}</button>
        <button class="btn btn-outline btn-sm" id="btnImportarExcel">⇧ Importar Excel</button>
        <input type="file" id="excelImportInput" accept=".xlsx,.xls,.csv" style="display:none">
        <button class="btn btn-sm" id="btnNovoLead">+ Novo lead</button>
      </div>
    </div>
    <div class="pillbar" id="leadPills"></div>
    ${canManageTeam()?'<div class="pillbar" id="leadCorretorPills"></div>':''}
    <div id="leadBody"></div>
  `;
  const base = scoped(state.leads);
  const pills = document.getElementById('leadPills');
  const counts = {Todos: base.length};
  LEAD_STATUSES.forEach(s=> counts[s] = base.filter(l=>l.status===s).length);
  pills.innerHTML = ['Todos', ...LEAD_STATUSES].map(s=>`<button class="pill ${leadFilter===s?'active':''}" data-s="${s}">${s} (${counts[s]||0})</button>`).join('');
  pills.querySelectorAll('.pill').forEach(p=>p.addEventListener('click', ()=>{ leadFilter=p.dataset.s; renderLeads(); }));

  if(canManageTeam()){
    const cp = document.getElementById('leadCorretorPills');
    const nomes = isGestor() ? state.usuarios.map(u=>u.nome) : state.usuarios.filter(u=>teamMemberIds().includes(u.id)).map(u=>u.nome);
    cp.innerHTML = ['Todos', ...nomes].map(n=>`<button class="pill ${leadCorretorFilter===n?'active':''}" data-n="${n}">${n}</button>`).join('');
    cp.querySelectorAll('.pill').forEach(p=>p.addEventListener('click', ()=>{ leadCorretorFilter=p.dataset.n; renderLeads(); }));
  }

  document.getElementById('btnNovoLead').addEventListener('click', ()=>openLeadForm());
  document.getElementById('toggleKanban').addEventListener('click', ()=>{ leadView = leadView==='lista'?'kanban':'lista'; renderLeads(); });
  document.getElementById('btnImportarExcel').addEventListener('click', ()=>document.getElementById('excelImportInput').click());
  document.getElementById('excelImportInput').addEventListener('change', (e)=>{
    if(e.target.files[0]) importLeadsFromExcel(e.target.files[0]);
    e.target.value='';
  });
  const btnSel = document.getElementById('btnSelecionarLeads');
  if(btnSel) btnSel.addEventListener('click', ()=>{
    leadSelectMode = !leadSelectMode;
    if(!leadSelectMode) leadSelected.clear();
    renderLeads();
  });
  const btnTransf = document.getElementById('btnTransferirLeads');
  if(btnTransf) btnTransf.addEventListener('click', ()=>openTransferirLeadsForm());
  const btnRemkt = document.getElementById('btnEnviarRemarketing');
  if(btnRemkt) btnRemkt.addEventListener('click', ()=>openEnviarRemarketingForm());
  const btnIrRemkt = document.getElementById('btnIrRemarketing');
  if(btnIrRemkt) btnIrRemkt.addEventListener('click', ()=>{
    leadView = 'lista';
    leadFilter = 'Remarketing';
    leadSelectMode = true;
    leadSelected.clear();
    renderLeads();
  });

  let pool = base;
  if(canManageTeam() && leadCorretorFilter!=='Todos'){
    const u = state.usuarios.find(x=>x.nome===leadCorretorFilter);
    pool = pool.filter(l=>u && l.corretorId===u.id);
  }
  const filtered = leadFilter==='Todos' ? pool : pool.filter(l=>l.status===leadFilter);
  const body = document.getElementById('leadBody');

  if(leadView==='kanban'){
    const scrollPrevio = body.querySelector('.kanban') ? body.querySelector('.kanban').scrollLeft : 0;
    body.innerHTML = `<div class="kanban">${LEAD_STATUSES.map(s=>`
      <div class="kcol" data-status="${s}"><h4>${s} (${pool.filter(l=>l.status===s).length})</h4>
        ${pool.filter(l=>l.status===s).map(l=>`
          <div class="kcard" draggable="true" data-id="${l.id}"><b>${l.nome}</b>${l.origem} · ${l.tipo}${l.orcamento?`<br>${fmtMoney(l.orcamento)}`:''}${isGestor()?`<br><span style="color:var(--ink-soft);">${corretorNome(l.corretorId)}</span>`:''}</div>
        `).join('')}
      </div>`).join('')}</div>`;
    const novoKanban = body.querySelector('.kanban');
    if(novoKanban) novoKanban.scrollLeft = scrollPrevio;
    bindKanbanEvents(body);
    return;
  }

  if(!filtered.length){
    body.innerHTML = emptyState('Nenhum lead nesse filtro', 'Ajuste o filtro acima ou cadastre um novo lead.');
    return;
  }
  body.innerHTML = `
    <div class="table-scroll">
    <table><thead><tr>${leadSelectMode?'<th></th>':''}<th>Nome</th><th>Contato</th><th>Origem</th><th>Tipo</th><th>Orçamento</th><th>Status</th>${canManageTeam()?'<th>Corretor</th>':''}<th>Sem interação há</th><th></th></tr></thead>
    <tbody>${filtered.map(l=>{
      const pend = leadPendenciaInfo(l);
      return `
      <tr>
        ${leadSelectMode?`<td><input type="checkbox" class="lead-select" data-id="${l.id}" ${leadSelected.has(l.id)?'checked':''} style="width:18px; height:18px; cursor:pointer;"></td>`:''}
        <td><a href="#" class="lead-open" data-id="${l.id}" style="color:var(--ink); font-weight:600; text-decoration:none;">${l.nome}</a> ${roletaBadgeHtml(l)}</td>
        <td class="mono">${l.telefone||'—'}</td>
        <td>${l.origem}</td>
        <td>${l.tipo}</td>
        <td class="mono">${l.orcamento?fmtMoney(l.orcamento):'—'}</td>
        <td>${stamp(l.status)}</td>
        ${canManageTeam()?`<td>${corretorNome(l.corretorId)}</td>`:''}
        <td>${pend?`<span class="stamp s-vermelho" title="${pend.tipo}">⚠ ${tempoSemInteracaoTexto(l)}</span>`:`<span class="mono" style="color:var(--ink-soft);">${tempoSemInteracaoTexto(l)}</span>`}</td>
        <td><button class="btn-sm btn-outline lead-open" data-id="${l.id}">Abrir</button></td>
      </tr>
    `;}).join('')}</tbody></table>
    </div>
  `;
  if(leadSelectMode){
    body.querySelectorAll('.lead-select').forEach(cb=>cb.addEventListener('change', ()=>{
      if(cb.checked) leadSelected.add(cb.dataset.id); else leadSelected.delete(cb.dataset.id);
      renderLeads();
    }));
  }
  body.querySelectorAll('.lead-open').forEach(el=>el.addEventListener('click', e=>{ e.preventDefault(); openLeadDetail(el.dataset.id); }));
}

function openTransferirLeadsForm(){
  const ids = Array.from(leadSelected);
  if(!ids.length) return;
  const opts = isGestor() ? state.usuarios.map(u=>u.nome) : state.usuarios.filter(u=>teamMemberIds().includes(u.id)).map(u=>u.nome);
  openModal({
    title: `Transferir ${ids.length} lead(s) para outro corretor`,
    schema: [{key:'corretorNome', label:'Novo corretor responsável', type:'select', options: opts}],
    data: {},
    onSave: (r)=>{
      const u = state.usuarios.find(x=>x.nome===r.corretorNome);
      if(!u){ alert('Selecione um corretor.'); return; }
      state.leads.filter(l=>ids.includes(l.id)).forEach(l=>{ l.corretorId = u.id; });
      leadSelected.clear();
      leadSelectMode = false;
      save(); closeModal(); renderLeads();
      toast(`${ids.length} lead(s) transferido(s) para ${u.nome}.`);
    }
  });
}

function openEnviarRemarketingForm(){
  const ids = Array.from(leadSelected);
  if(!ids.length) return;
  let fotoAtual = null;
  const nomesSelecionados = state.leads.filter(l=>ids.includes(l.id)).map(l=>l.nome).join(', ');
  openModal({
    title: `Enviar mensagem de remarketing para ${ids.length} cliente(s)`,
    schema: [
      {key:'mensagem', label:'Mensagem', type:'textarea'}
    ],
    data: {},
    extraHtml: `
      <p style="font-size:11.5px; color:var(--ink-soft); margin-top:-6px;">Vai para: ${nomesSelecionados}</p>
      <div class="field">
        <label>Foto (opcional, vai anexada à mensagem)</label>
        <div class="logo-edit-wrap">
          <div class="logo-preview" id="remktFotoPreview">—</div>
          <div>
            <input type="file" id="remktFotoFile" accept="image/*">
          </div>
        </div>
      </div>
    `,
    onSave: async (r)=>{
      if(!r.mensagem || !r.mensagem.trim()){ alert('Escreva a mensagem.'); return; }
      await sendRemarketingWhatsapp(ids, r.mensagem.trim(), fotoAtual);
    }
  });
  const fotoInput = document.getElementById('remktFotoFile');
  if(fotoInput) fotoInput.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      fotoAtual = reader.result;
      document.getElementById('remktFotoPreview').innerHTML = `<img src="${fotoAtual}">`;
    };
    reader.readAsDataURL(file);
  });
}

async function sendRemarketingWhatsapp(ids, mensagem, fotoDataUrl){
  const leadsAlvo = state.leads.filter(l=>ids.includes(l.id));
  const semTelefone = leadsAlvo.filter(l=>!l.telefone);
  if(semTelefone.length){
    alert(`${semTelefone.length} cliente(s) selecionado(s) não têm telefone cadastrado e serão ignorados: ${semTelefone.map(l=>l.nome).join(', ')}`);
  }
  const alvos = leadsAlvo.filter(l=>l.telefone);
  if(!alvos.length){ alert('Nenhum cliente selecionado tem telefone cadastrado.'); return; }
  if(!sb){ alert('Sem conexão com o servidor agora. Tente novamente em instantes.'); return; }
  try{
    const { data: userData } = await sb.auth.getUser();
    const linhas = alvos.map(l=>({
      lead_id: l.id,
      telefone: l.telefone,
      nome: l.nome,
      mensagem,
      foto_base64: fotoDataUrl || null,
      status: 'pendente',
      criado_por: userData?.user?.id || null
    }));
    const { error } = await sb.from('remarketing_fila').insert(linhas);
    if(error){ alert('Erro ao agendar o envio: ' + error.message); return; }
    alvos.forEach(l=>{
      l.interacoes = l.interacoes || [];
      l.interacoes.push({ data: todayISO(), descricao: `Remarketing agendado via WhatsApp: "${mensagem}"` });
      l.ultimoContato = todayISO();
    });
    leadSelected.clear();
    leadSelectMode = false;
    save(); closeModal(); renderLeads();
    toast(`Mensagem de remarketing agendada para ${alvos.length} cliente(s). Envio automático em instantes.`);
  }catch(err){
    console.error(err);
    alert('Erro ao agendar as mensagens. Tente novamente.');
  }
}

function bindKanbanEvents(body){
  let draggedId = null;
  body.querySelectorAll('.kcard').forEach(card=>{
    card.addEventListener('dragstart', ()=>{ draggedId = card.dataset.id; card.classList.add('dragging'); });
    card.addEventListener('dragend', ()=>{ card.classList.remove('dragging'); });
    card.addEventListener('click', ()=>openLeadDetail(card.dataset.id));
  });
  body.querySelectorAll('.kcol').forEach(col=>{
    col.addEventListener('dragover', e=>{ e.preventDefault(); col.classList.add('dragover'); });
    col.addEventListener('dragleave', ()=>col.classList.remove('dragover'));
    col.addEventListener('drop', e=>{
      e.preventDefault(); col.classList.remove('dragover');
      const lead = state.leads.find(l=>l.id===draggedId);
      if(!lead) return;
      changeLeadStatus(lead, col.dataset.status, ()=>renderLeads());
    });
  });
}

function changeLeadStatus(lead, novoStatus, after){
  if(novoStatus === lead.status){ if(after) after(); return; }
  if(novoStatus==='Fechou'){
    openFecharLeadFlow(lead, after);
    return;
  }
  if(novoStatus==='Perdido'){
    const motivo = prompt('Motivo da perda (opcional):') || '';
    lead.observacoes = (lead.observacoes?lead.observacoes+' | ':'') + (motivo?('Perdido: '+motivo):'Perdido.');
  }
  lead.status = novoStatus;
  if(lead.roletaStatus === 'aguardando') lead.roletaStatus = 'atendido';
  save();
  toast('Status atualizado para "'+novoStatus+'".');
  if(after) after();
}

function openLeadForm(existing){
  const schema = leadSchema();
  const imAtual = existing && state.imoveis.find(i=>i.id===existing.imovelInteresseId);
  const prodAtual = existing && state.produtos.find(p=>p.id===existing.produtoId);
  const data = existing ? Object.assign({}, existing, {corretorNome: corretorNome(existing.corretorId), imovelCodigo: imAtual?imAtual.codigo:'(nenhum)', produtoNome: prodAtual?prodAtual.nome:'(nenhum)'}) : {imovelCodigo:'(nenhum)', produtoNome:'(nenhum)'};
  openModal({
    title: existing ? 'Editar lead' : 'Novo lead',
    schema, data,
    onSave: (result)=>{
      let corretorId = existing ? existing.corretorId : currentUser().id;
      if(canManageTeam() && result.corretorNome){
        const u = state.usuarios.find(x=>x.nome===result.corretorNome);
        if(u) corretorId = u.id;
      }
      const imSel = state.imoveis.find(i=>i.codigo===result.imovelCodigo);
      const imovelInteresseId = imSel ? imSel.id : null;
      const prodSel = state.produtos.find(p=>p.nome===result.produtoNome);
      const produtoId = prodSel ? prodSel.id : null;
      delete result.corretorNome; delete result.imovelCodigo; delete result.produtoNome;
      if(existing){
        Object.assign(existing, result, {corretorId, imovelInteresseId, produtoId});
        toast('Lead atualizado.');
      }else{
        const lead = Object.assign({
          id: uid(), status:'Novo', dataCriacao: todayISO(), ultimoContato: todayISO(), interacoes:[], corretorId, imovelInteresseId, produtoId
        }, result);
        state.leads.push(lead);
        toast('Lead cadastrado.');
      }
      save(); closeModal(); renderLeads();
    }
  });
}

function openLeadDetail(id){
  const lead = state.leads.find(l=>l.id===id);
  if(!lead) return;
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-overlay" id="overlay">
      <div class="modal">
        <button class="btn-sm btn-outline modal-close" id="closeDetail">Fechar</button>
        <h3>${lead.nome}</h3>
        <div style="margin-bottom:14px;">${stamp(lead.status)} ${roletaBadgeHtml(lead)} <span class="mono" style="font-size:11px; color:var(--ink-soft); margin-left:8px;">criado em ${fmtDate(lead.dataCriacao)}</span>${isGestor()?` <span class="mono" style="font-size:11px; color:var(--ink-soft);">· ${corretorNome(lead.corretorId)}</span>`:''}${leadPendenciaInfo(lead)?` <span class="stamp s-vermelho">⚠ Pendente — agende a próxima ação</span>`:''}</div>

          <div><b>Telefone:</b> ${lead.telefone||'—'}</div>
          <div><b>E-mail:</b> ${lead.email||'—'}</div>
          <div><b>Origem:</b> ${lead.origem}</div>
          <div><b>Tipo:</b> ${lead.tipo}</div>
          <div><b>Orçamento:</b> ${lead.orcamento?fmtMoney(lead.orcamento):'—'}</div>
          <div><b>Bairros:</b> ${lead.bairrosInteresse||'—'}</div>
        </div>
        ${(()=>{ const p = state.produtos.find(x=>x.id===lead.produtoId); return p ? `<div style="margin-bottom:10px;"><span class="stamp s-azul">📦 ${p.nome}</span></div>` : ''; })()}
        ${(()=>{ const im = state.imoveis.find(i=>i.id===lead.imovelInteresseId); return im ? `<div class="card" style="margin-bottom:14px; padding:10px 14px; display:flex; align-items:center; justify-content:space-between;"><span style="font-size:13px;">🏠 Interesse no lote <b>${im.codigo}</b></span><button class="btn-sm btn-outline" id="verImovelLead">Ver lote</button></div>` : ''; })()}
        ${lead.observacoes?`<p style="font-size:13px; color:var(--ink-soft);">${lead.observacoes}</p>`:''}

        <div class="field">
          <label>Mudar status</label>
          <select id="statusSelect">${LEAD_STATUSES.map(s=>`<option value="${s}" ${s===lead.status?'selected':''}>${s}</option>`).join('')}</select>
        </div>

        <div class="field">
          <label>Nova interação (opcional)</label>
          <input type="text" id="novaInteracao" placeholder="Ex: Ligação de retorno, enviado material..." style="margin-bottom:8px;">
          <div class="card" style="padding:12px 14px; border-color:var(--azul);">
            <label style="font-size:11px; font-weight:600; color:var(--azul); text-transform:uppercase; display:block; margin-bottom:8px;">📅 Próximo contato (obrigatório se preencher a interação)</label>
            <div class="grid grid-3">
              <div class="field" style="margin-bottom:0;"><label>Data</label><input type="date" id="proxData" value="${todayISO()}"></div>
              <div class="field" style="margin-bottom:0;"><label>Hora</label><input type="time" id="proxHora" value="${new Date().toTimeString().slice(0,5)}"></div>
              <div class="field" style="margin-bottom:0;"><label>Tipo</label><select id="proxTipo"><option>Telefone</option><option>WhatsApp</option><option>Presencial</option><option>E-mail</option></select></div>
            </div>
          </div>
        </div>

        <div style="margin-top:10px;">
          <label style="font-size:11.5px; font-weight:600; color:var(--ink-soft); text-transform:uppercase;">Histórico</label>
          <ul class="timeline">
            ${(lead.interacoes||[]).slice().reverse().map(i=>`<li><span>${fmtDate(i.data)}</span>${i.descricao}</li>`).join('') || '<li style="color:var(--ink-soft);">Sem interações registradas.</li>'}
          </ul>
        </div>

        <div class="modal-actions">
          ${canManageTeam()?'<button class="btn-danger btn btn-sm" id="delLead">Excluir lead</button>':''}
          <button class="btn-outline btn btn-sm" id="editLead">Editar dados</button>
          <button class="btn btn-sm" id="saveDetail">Salvar</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeModal(); });
  document.getElementById('closeDetail').addEventListener('click', closeModal);
  document.getElementById('editLead').addEventListener('click', ()=>{ closeModal(); openLeadForm(lead); });
  const verImovelBtn = document.getElementById('verImovelLead');
  if(verImovelBtn) verImovelBtn.addEventListener('click', ()=>{ closeModal(); openImovelDetail(lead.imovelInteresseId); });
  const delLeadBtn = document.getElementById('delLead');
  if(delLeadBtn) delLeadBtn.addEventListener('click', ()=>{
    if(!confirm('Excluir este lead permanentemente?')) return;
    state.leads = state.leads.filter(l=>l.id!==id);
    if(sb) sb.from('leads').delete().eq('id', id).then(({error})=>{ if(error) console.error(error); });
    save(); closeModal(); renderLeads();
  });
  // Botão único: salva status + (se preenchida) a interação e o agendamento, tudo de uma vez
  document.getElementById('saveDetail').addEventListener('click', ()=>{
    const novoStatus = document.getElementById('statusSelect').value;
    const val = document.getElementById('novaInteracao').value.trim();
    const proxData = document.getElementById('proxData').value;
    const proxHora = document.getElementById('proxHora').value;
    const proxTipo = document.getElementById('proxTipo').value;

    if(val && (!proxData || !proxHora)){
      alert('Data e hora do próximo contato são obrigatórias quando você registra uma interação.');
      return;
    }

    if(val){
      lead.interacoes = lead.interacoes || [];
      lead.interacoes.push({data: todayISO(), descricao: val});
      lead.ultimoContato = todayISO();
      if(lead.roletaStatus === 'aguardando') lead.roletaStatus = 'atendido';
    }

    // Agenda o compromisso sempre que data e hora forem preenchidas — mesmo sem uma interação escrita
    if(proxData && proxHora){
      state.compromissos.push({
        id: uid(), titulo: `Follow-up: ${lead.nome}`, tipo: proxTipo,
        data: proxData, hora: proxHora, prioridade: 'Média',
        descricao: val ? `Continuação do atendimento — ${val}` : `Próximo contato com ${lead.nome}`,
        leadId: lead.id, imovelId: lead.imovelInteresseId||null,
        corretorId: lead.corretorId || currentUser().id, status: 'Pendente'
      });
      checkReminders();
    }

    closeModal();
    changeLeadStatus(lead, novoStatus, ()=>{ save(); renderLeads(); toast((val||proxData) ? 'Registrado e status atualizado.' : 'Status atualizado.'); });
  });
}

function openFecharLeadFlow(lead, after){
  const imAtual = state.imoveis.find(i=>i.id===lead.imovelInteresseId);
  openModal({
    title: `Fechar negócio — criar cliente para ${lead.nome}`,
    schema: [
      {key:'cpfCnpj', label:'CPF/CNPJ'},
      {key:'endereco', label:'Endereço'},
      {key:'dataNascimento', label:'Data de nascimento', type:'date'},
      {key:'profissao', label:'Profissão'},
      {key:'imovelCodigo', label:'Lote fechado', type:'select', options:['(nenhum)', ...state.imoveis.map(i=>i.codigo)]},
      {key:'novoStatusImovel', label:'Marcar lote como', type:'select', options:['Não alterar','Vendido','Reservado']}
    ],
    data:{imovelCodigo: imAtual?imAtual.codigo:'(nenhum)', novoStatusImovel:'Não alterar'},
    onSave:(result)=>{
      lead.status = 'Fechou';
      const imSel = state.imoveis.find(i=>i.codigo===result.imovelCodigo);
      const vinculados = imSel ? [imSel.id] : [];
      const cliente = Object.assign({
        id: uid(), nome: lead.nome, telefone: lead.telefone, email: lead.email,
        imoveisVinculados: vinculados, dataFechamento: todayISO(), corretorId: lead.corretorId
      }, {cpfCnpj:result.cpfCnpj, endereco:result.endereco, dataNascimento:result.dataNascimento, profissao:result.profissao});
      state.clientes.push(cliente);
      if(imSel && result.novoStatusImovel!=='Não alterar'){
        imSel.status = result.novoStatusImovel;
      }
      save(); closeModal();
      toast('Negócio fechado! Cliente criado.');
      if(after) after(); else renderLeads();
    }
  });
}

/* ---------- Importação de leads via planilha Excel/CSV ---------- */
function normalizeHeader(h){
  return String(h||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
}
const LEAD_FIELD_ALIASES = {
  nome: ['nome','name','cliente'],
  telefone: ['telefone','fone','celular','whatsapp','phone','contato'],
  email: ['email'],
  origem: ['origem','fonte','source'],
  tipo: ['tipo','categoria'],
  orcamento: ['orcamento','budget','valor'],
  bairrosInteresse: ['bairro','bairros','regiao'],
  tipoImovelDesejado: ['tipoimovel','imoveldesejado'],
  observacoes: ['observacao','observacoes','obs','notas','nota']
};
function mapRowToLead(row){
  const out = {};
  Object.keys(row).forEach(h=>{
    const norm = normalizeHeader(h);
    for(const field in LEAD_FIELD_ALIASES){
      if(LEAD_FIELD_ALIASES[field].some(alias=> norm.includes(alias))){ out[field] = row[h]; break; }
    }
  });
  return out;
}
function importLeadsFromExcel(file){
  if(typeof XLSX === 'undefined'){
    alert('Não foi possível carregar o leitor de planilhas (é preciso estar conectado à internet na primeira vez que abrir o sistema).');
    return;
  }
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
      if(!rows.length){ alert('Planilha vazia ou sem dados reconhecíveis.'); return; }
      const mapped = rows.map(mapRowToLead).filter(r=>r.nome && String(r.nome).trim());
      if(!mapped.length){ alert('Não encontrei uma coluna de nome nos dados. Verifique se a planilha tem um cabeçalho como "Nome".'); return; }
      confirmImportLeads(mapped);
    }catch(err){
      console.error(err);
      alert('Não consegui ler esse arquivo. Verifique se é um .xlsx, .xls ou .csv válido.');
    }
  };
  reader.readAsArrayBuffer(file);
}
function normalizeTelefone(tel){
  return String(tel||'').replace(/\D/g,'');
}
function encontrarLeadDuplicado(m){
  const telNorm = normalizeTelefone(m.telefone);
  const emailNorm = String(m.email||'').trim().toLowerCase();
  return state.leads.find(l=>{
    if(telNorm && normalizeTelefone(l.telefone)===telNorm) return true;
    if(emailNorm && String(l.email||'').trim().toLowerCase()===emailNorm) return true;
    return false;
  });
}
function confirmImportLeads(mapped){
  // Feature: detecta duplicados (por telefone ou e-mail) e identifica se já pertencem a outro corretor
  const analisados = mapped.map(m=>{
    const dup = encontrarLeadDuplicado(m);
    return { m, dup, outroCorretor: dup && dup.corretorId && dup.corretorId !== currentUser().id };
  });
  const novos = analisados.filter(a=>!a.dup).length;
  const duplicados = analisados.filter(a=>a.dup).length;
  const deOutroCorretor = analisados.filter(a=>a.outroCorretor);

  const schema = [];
  if(isGestor() || isGerente()) schema.push({key:'corretorNome', label:'Atribuir todos ao corretor', type:'select', options: (isGestor()?state.usuarios:state.usuarios.filter(u=>teamMemberIds().includes(u.id))).map(u=>u.nome)});
  // Feature: escolher o empreendimento de destino para os leads importados
  schema.push({key:'produtoNome', label:'Empreendimento (produto) de destino', type:'select', options:['(nenhum)', ...state.produtos.map(p=>p.nome)]});

  const avisoDuplicados = duplicados ? `
    <div class="card" style="border-color:var(--latao); margin-top:10px;">
      <p style="font-size:12.5px; margin:0 0 6px 0;"><b>${duplicados}</b> contato(s) já existem no sistema (mesmo telefone/e-mail) — serão <b>atualizados</b>, não duplicados.</p>
      ${deOutroCorretor.length ? `
        <p style="font-size:12.5px; color:var(--vermelho); margin:8px 0 6px 0;"><b>${deOutroCorretor.length}</b> desses já estão sendo atendidos por outro corretor: ${deOutroCorretor.map(a=>`${a.m.nome} (com ${corretorNome(a.dup.corretorId)})`).join(', ')}.</p>
        <label style="display:flex; align-items:center; gap:8px; font-size:12.5px; cursor:pointer;">
          <input type="checkbox" id="importTransferirDuplicados" style="width:16px; height:16px;">
          Transferir esses lead(s) para o corretor selecionado acima
        </label>
      ` : ''}
    </div>
  ` : '';

  openModal({
    title: `Importar ${mapped.length} lead(s) da planilha`,
    schema, data:{corretorNome: currentUser().nome, produtoNome:'(nenhum)'},
    extraHtml: `<p style="font-size:12.5px; color:var(--ink-soft);">Encontrei <b>${mapped.length}</b> linha(s) com nome preenchido — <b>${novos}</b> novo(s). Colunas não reconhecidas (origem, tipo etc.) usam um valor padrão e podem ser ajustadas depois em cada lead.</p>${avisoDuplicados}`,
    onSave:(r)=>{
      let corretorId = currentUser().id;
      if((isGestor()||isGerente()) && r.corretorNome){
        const u = state.usuarios.find(x=>x.nome===r.corretorNome);
        if(u) corretorId = u.id;
      }
      const prodSel = state.produtos.find(p=>p.nome===r.produtoNome);
      const produtoId = prodSel ? prodSel.id : null;
      const transferirDuplicados = document.getElementById('importTransferirDuplicados');
      const podeTransferir = transferirDuplicados ? transferirDuplicados.checked : false;

      let criados = 0, atualizados = 0;
      analisados.forEach(({m, dup, outroCorretor})=>{
        if(dup){
          // Atualiza o lead existente em vez de duplicar
          dup.nome = String(m.nome||dup.nome).trim();
          if(m.telefone) dup.telefone = String(m.telefone);
          if(m.email) dup.email = String(m.email);
          if(m.bairrosInteresse) dup.bairrosInteresse = String(m.bairrosInteresse);
          if(m.tipoImovelDesejado) dup.tipoImovelDesejado = String(m.tipoImovelDesejado);
          if(m.observacoes) dup.observacoes = (dup.observacoes?dup.observacoes+' | ':'') + String(m.observacoes);
          if(produtoId) dup.produtoId = produtoId;
          if(!outroCorretor || podeTransferir) dup.corretorId = corretorId;
          atualizados++;
        }else{
          state.leads.push({
            id: uid(), nome:String(m.nome||'').trim(), telefone:String(m.telefone||''), email:String(m.email||''),
            origem: LEAD_ORIGENS.includes(m.origem)?m.origem:'Outros',
            tipo: LEAD_TIPOS.includes(m.tipo)?m.tipo:'Comprador',
            orcamento: parseFloat(m.orcamento)||0,
            bairrosInteresse: String(m.bairrosInteresse||''),
            tipoImovelDesejado: String(m.tipoImovelDesejado||''),
            observacoes: String(m.observacoes||''),
            imovelInteresseId: null, produtoId,
            status:'Novo', dataCriacao: todayISO(), ultimoContato: todayISO(), interacoes:[], corretorId
          });
          criados++;
        }
      });
      save(); closeModal(); renderLeads();
      toast(`${criados} lead(s) novo(s), ${atualizados} atualizado(s).`);
    }
  });
}

const IMOVEL_STATUSES = ['Disponível','Reservado','Vendido','Em Negociação'];

/* Cálculo da parcela pela Tabela Price (juros compostos), a partir do saldo financiado */
function calcParcela(valorFinanciado, taxaMensalPercent, meses){
  const pv = Number(valorFinanciado)||0;
  const n = Number(meses)||0;
  const i = (Number(taxaMensalPercent)||0)/100;
  if(n<=0 || pv<=0) return 0;
  if(i===0) return pv/n;
  return pv * i / (1 - Math.pow(1+i, -n));
}
function condicoesDefault(){
  return { entrada:0, meses:80, taxaJuros:0.6 };
}
function condicoesPadraoDefault(){
  return { entradaPercent:10, meses:80, taxaJuros:0.6 };
}
/* Converte texto de planilha em número, aceitando formato BR (1.234,56) ou padrão (1234.56) */
function parseMoneyBR(v){
  if(v===undefined || v===null || v==='') return 0;
  if(typeof v === 'number') return v;
  let s = String(v).trim().replace(/[^\d,.-]/g,'');
  if(s.includes(',') && s.includes('.')) s = s.replace(/\./g,'').replace(',', '.');
  else if(s.includes(',')) s = s.replace(',', '.');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

}

function renderImovelList(){
  const prod = state.produtos.find(p=>p.nome===imovelFilter.produto);
  const todosDoProduto = prod ? state.imoveis.filter(i=>i.produtoId===prod.id) : [];

  // Feature 5: painel de resumo do produto selecionado

  if(resumoEl && prod){
    const totalLotes = todosDoProduto.length;
    const valorTotal = todosDoProduto.reduce((s,i)=>s+Number(i.valores.valor||0),0);
    const livres = todosDoProduto.filter(i=>i.status==='Disponível').length;
    const reservados = todosDoProduto.filter(i=>i.status==='Reservado').length;
    const vendidos = todosDoProduto.filter(i=>i.status==='Vendido').length;
    const pctVendas = totalLotes ? Math.round(100*vendidos/totalLotes) : 0;
    resumoEl.innerHTML = `
      <div class="grid grid-4 section-block">
        <div class="card"><div class="kpi-label">Total de lotes</div><div class="kpi-value">${totalLotes}</div></div>

        <div class="card"><div class="kpi-label">% Vendido</div><div class="kpi-value">${pctVendas}%</div><div class="kpi-sub">${vendidos} vendido(s)</div></div>
      </div>
    `;
  }else if(resumoEl){
    resumoEl.innerHTML = '';
  }

  let list = todosDoProduto;
  if(imovelFilter.status!=='Todos') list = list.filter(i=>i.status===imovelFilter.status);
  if(imovelBusca.trim()){
    const q = imovelBusca.trim().toLowerCase();
    list = list.filter(i => (i.codigo||'').toLowerCase().includes(q) || String(i.endereco.lote||'').toLowerCase().includes(q) || String(i.endereco.quadra||'').toLowerCase().includes(q));
  }

  const body = document.getElementById('imoveisBody');
  body.innerHTML = list.length ? `<div class="imoveis-grid">${list.map(im=>imovelCardHtml(im, imovelSelectMode)).join('')}</div>` : emptyState('Nenhum lote encontrado', 'Ajuste os filtros, a busca, cadastre um lote ou importe uma planilha.');
  bindImovelCardClicks(imovelSelectMode);
}

      card.addEventListener('click', (e)=>{

        const id = card.dataset.id;
        if(imovelSelected.has(id)) imovelSelected.delete(id); else imovelSelected.add(id);
        renderImoveis();
      });
    }else{
      card.addEventListener('click', ()=>openImovelDetail(card.dataset.id));
    }
  });

    document.querySelectorAll('input[data-select-id]').forEach(cb=>{

/* ---------- Importação de lotes via planilha Excel/CSV ---------- */
const LOTE_FIELD_ALIASES = {
  quadra: ['quadra','qd'],
  lote: ['lote','lt','unidade'],
  areaTotal: ['area','areatotal','metragem','m2'],
  valor: ['valor','preco','precovenda'],
  status: ['status','situacao'],
  entrada: ['entrada','sinal'],
  meses: ['meses','prazo','parcelas'],
  taxaJuros: ['juros','taxa','taxajuros']
};
function mapRowToLote(row){
  const out = {};
  Object.keys(row).forEach(h=>{
    const norm = normalizeHeader(h);
    for(const field in LOTE_FIELD_ALIASES){
      if(LOTE_FIELD_ALIASES[field].some(alias=> norm.includes(alias))){ out[field] = row[h]; break; }
    }
  });
  return out;
}
function importLotesFromExcel(file){
  if(typeof XLSX === 'undefined'){
    alert('Não foi possível carregar o leitor de planilhas (é preciso estar conectado à internet na primeira vez que abrir o sistema).');
    return;
  }
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
      if(!rows.length){ alert('Planilha vazia ou sem dados reconhecíveis.'); return; }
      const mapped = rows.map(mapRowToLote).filter(r=>r.quadra || r.lote);
      if(!mapped.length){ alert('Não encontrei colunas de quadra/lote. Verifique os cabeçalhos da planilha (ex: "Quadra", "Lote", "Área", "Valor", "Status").'); return; }
      confirmImportLotes(mapped);
    }catch(err){
      console.error(err);
      alert('Não consegui ler esse arquivo. Verifique se é um .xlsx, .xls ou .csv válido.');
    }
  };
  reader.readAsArrayBuffer(file);
}
function confirmImportLotes(mapped){
  openModal({
    title: `Importar ${mapped.length} lote(s) da planilha`,
    schema: [{key:'produtoNome', label:'Loteamento (todos os lotes serão vinculados a ele)', type:'select', options: state.produtos.map(p=>p.nome)}],
    data: {produtoNome: state.produtos[0]?state.produtos[0].nome:''},
    extraHtml: `<p style="font-size:12.5px; color:var(--ink-soft);">Encontrei <b>${mapped.length}</b> linha(s) com quadra/lote preenchidos. Lotes com a mesma quadra e número já cadastrados nesse loteamento serão atualizados, não duplicados.</p>`,
    onSave:(r)=>{
      const prod = state.produtos.find(p=>p.nome===r.produtoNome);
      if(!prod){ alert('Selecione o loteamento.'); return; }
      const cp = prod.condicoesPadrao || condicoesPadraoDefault();
      let criados = 0, atualizados = 0;
      mapped.forEach(m=>{
        const quadraStr = String(m.quadra||'').trim();
        const loteStr = String(m.lote||'').trim();
        const valor = parseMoneyBR(m.valor);
        const condicoes = {
          entrada: m.entrada!==undefined && m.entrada!=='' ? parseMoneyBR(m.entrada) : Math.round(valor * (cp.entradaPercent||10)/100),
          meses: m.meses!==undefined && m.meses!=='' ? (parseInt(m.meses)||cp.meses) : cp.meses,
          taxaJuros: m.taxaJuros!==undefined && m.taxaJuros!=='' ? parseMoneyBR(m.taxaJuros) : cp.taxaJuros
        };
        const areaTotal = parseMoneyBR(m.areaTotal);
        const status = IMOVEL_STATUSES.includes(m.status)?m.status:null;
        const existenteLote = state.imoveis.find(i=> i.produtoId===prod.id && String(i.endereco.quadra||'').trim()===quadraStr && String(i.endereco.lote||'').trim()===loteStr);
        if(existenteLote){
          existenteLote.caracteristicas = {areaTotal: areaTotal || existenteLote.caracteristicas.areaTotal};
          existenteLote.valores = {valor: valor || existenteLote.valores.valor};
          existenteLote.condicoes = condicoes;
          if(status) existenteLote.status = status;
          atualizados++;
        }else{
          state.imoveis.push({
            id: uid(), produtoId: prod.id,
            status: status || 'Disponível',
            endereco: {quadra:quadraStr, lote:loteStr},
            caracteristicas: {areaTotal},
            valores: {valor},
            condicoes,
            descricao: '', destaques: [], codigo: loteCodigo(quadraStr, loteStr),
            fotos: [], destaque:false, visitas:0, dataCriacao: todayISO(), cadastradoPor: currentUser().id
          });
          criados++;
        }
      });
      save(); closeModal(); renderImoveis();
      toast(`${criados} lote(s) criado(s), ${atualizados} atualizado(s).`);
    }
  });
}
