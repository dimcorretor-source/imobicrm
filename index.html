    list = list.filter(cm=>u && cm.corretorId===u.id);
  }
  if(agendaFilter==='hoje') list = list.filter(cm=>cm.data===hoje && cm.status==='Pendente');
  else if(agendaFilter==='semana') list = list.filter(cm=>cm.data>=hoje && cm.data<=semanaLimiteISO && cm.status==='Pendente');
  else if(agendaFilter==='concluidos') list = list.filter(cm=>cm.status!=='Pendente');
  else list = list.filter(cm=>cm.status==='Pendente');

  list.sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora));

  const body = document.getElementById('agendaBody');
  if(!list.length){
    body.innerHTML = emptyState('Nada por aqui', 'Agende visitas, ligações ou reuniões com o botão acima.');
    return;
  }
  body.innerHTML = `
    <div class="table-scroll">
    <table><thead><tr><th></th><th>Data</th><th>Hora</th><th>Título</th><th>Tipo</th><th>Prioridade</th><th>Status</th>${canManageTeam()?'<th>Corretor</th>':''}<th></th></tr></thead>
    <tbody>${list.map(cm=>`
      <tr>
        <td><input type="checkbox" class="comp-flag" data-id="${cm.id}" ${cm.status!=='Pendente'?'checked':''} title="Marcar como realizado" style="width:18px; height:18px; cursor:pointer;"></td>
        <td class="mono">${fmtDate(cm.data)}</td>
        <td class="mono">${cm.hora||'—'}</td>
        <td>${cm.titulo}</td>
        <td>${cm.tipo}</td>
        <td class="${cm.prioridade==='Alta'?'priority-alta':''}">${cm.prioridade}</td>
        <td>${stamp(cm.status)}</td>
        ${canManageTeam()?`<td>${corretorNome(cm.corretorId)}</td>`:''}
        <td style="display:flex; gap:6px; flex-wrap:wrap;">
          <button class="btn-sm btn-outline comp-edit" data-id="${cm.id}">Editar</button>
          <a class="gcal-link" href="${gcalUrl(cm)}" target="_blank" rel="noopener">📅 Google Agenda</a>
          <button class="btn-sm btn-danger comp-del" data-id="${cm.id}">🗑 Excluir</button>
        </td>
      </tr>
    `).join('')}</tbody></table>
    </div>
  `;
  body.querySelectorAll('.comp-flag').forEach(cb=>cb.addEventListener('change', ()=>{
    const cm = state.compromissos.find(x=>x.id===cb.dataset.id);
    cm.status = cb.checked ? 'Concluído' : 'Pendente';
    save(); renderAgenda();
    toast(cb.checked ? 'Compromisso marcado como realizado.' : 'Compromisso reaberto.');
  }));
  body.querySelectorAll('.comp-edit').forEach(b=>b.addEventListener('click', ()=>{
    openCompForm(state.compromissos.find(x=>x.id===b.dataset.id));
  }));
  body.querySelectorAll('.comp-del').forEach(b=>b.addEventListener('click', ()=>{
    if(!confirm('Excluir este compromisso permanentemente?')) return;
    state.compromissos = state.compromissos.filter(x=>x.id!==b.dataset.id);
    if(sb) sb.from('compromissos').delete().eq('id', b.dataset.id).then(({error})=>{ if(error) console.error(error); });
    save(); renderAgenda();
    toast('Compromisso excluído.');
  }));
}

function openCompForm(existing){
  const leadOptions = ['(nenhum)', ...scoped(state.leads).map(l=>l.nome)];
  const imovelOptions = ['(nenhum)', ...state.imoveis.map(i=>i.codigo)];
  const schema = [
    {key:'titulo', label:'Título'},
    {key:'tipo', label:'Tipo', type:'select', options:COMP_TIPOS},
    {key:'data', label:'Data', type:'date'},
    {key:'hora', label:'Hora', type:'time'},
    {key:'prioridade', label:'Prioridade', type:'select', options:COMP_PRIORIDADES},
    {key:'leadNome', label:'Lead vinculado', type:'select', options:leadOptions},
    {key:'imovelCodigo', label:'Lote vinculado', type:'select', options:imovelOptions},
    {key:'descricao', label:'Descrição', type:'textarea'}
  ];
  if(isGestor()){
    schema.push({key:'corretorNome', label:'Corretor responsável', type:'select', options: state.usuarios.map(u=>u.nome)});
  }
  let data = {prioridade:'Média', tipo:'Visita', data: todayISO()};
  if(existing){
    const lead = state.leads.find(l=>l.id===existing.leadId);
    const im = state.imoveis.find(i=>i.id===existing.imovelId);
    data = Object.assign({}, existing, {leadNome: lead?lead.nome:'(nenhum)', imovelCodigo: im?im.codigo:'(nenhum)', corretorNome: corretorNome(existing.corretorId)});
  }
  openModal({
    title: existing ? 'Editar compromisso' : 'Agendar compromisso',
    schema, data, wide:true,
    onSave:(r)=>{
      const lead = state.leads.find(l=>l.nome===r.leadNome);
      const im = state.imoveis.find(i=>i.codigo===r.imovelCodigo);
      let corretorId = existing ? existing.corretorId : currentUser().id;
      if(isGestor() && r.corretorNome){
        const u = state.usuarios.find(x=>x.nome===r.corretorNome);
        if(u) corretorId = u.id;
      }
      const obj = {titulo:r.titulo, tipo:r.tipo, data:r.data, hora:r.hora, prioridade:r.prioridade, descricao:r.descricao, leadId: lead?lead.id:null, imovelId: im?im.id:null, corretorId};
      if(existing){ Object.assign(existing, obj); toast('Compromisso atualizado.'); }
      else{ Object.assign(obj, {id:uid(), status:'Pendente'}); state.compromissos.push(obj); toast('Compromisso agendado.'); }
      save(); closeModal(); renderAgenda();
    }
  });
}

let finCorretorFilter = 'Todos';

function renderFinanceiro(){
  const c = document.getElementById('content');
  let comissoes = scoped(state.comissoes), receitas = scoped(state.receitas), despesas = scoped(state.despesas);
  if(canManageTeam() && finCorretorFilter!=='Todos'){
    const u = state.usuarios.find(x=>x.nome===finCorretorFilter);
    comissoes = comissoes.filter(x=>u && x.corretorId===u.id);
    receitas = receitas.filter(x=>u && x.corretorId===u.id);
    despesas = despesas.filter(x=>u && x.corretorId===u.id);
  }
  const mesAtual = todayISO().slice(0,7);
  const receitasMes = receitas.filter(r=>r.data.slice(0,7)===mesAtual).reduce((s,r)=>s+Number(r.valor||0),0);
  const comissoesMes = comissoes.filter(cm=>cm.status==='Recebido' && cm.dataRecebimento && cm.dataRecebimento.slice(0,7)===mesAtual).reduce((s,cm)=>s+Number(cm.valor||0),0);
  const despesasMes = despesas.filter(d=>d.data.slice(0,7)===mesAtual).reduce((s,d)=>s+Number(d.valor||0),0);
  const saldo = receitasMes + comissoesMes - despesasMes;
  const clientesFechados = scoped(state.clientes).filter(cl=>cl.dataFechamento && cl.dataFechamento.slice(0,7)===mesAtual).length;
  const ticketMedio = clientesFechados ? (receitasMes+comissoesMes)/clientesFechados : 0;

  c.innerHTML = `
    ${canManageTeam()?`<div class="pillbar" id="finPills"></div>`:''}
    <div class="grid grid-4 section-block">
      <div class="card"><div class="kpi-label">Receitas do mês</div><div class="kpi-value">${fmtMoney(receitasMes+comissoesMes)}</div></div>
      <div class="card"><div class="kpi-label">Despesas do mês</div><div class="kpi-value">${fmtMoney(despesasMes)}</div></div>
      <div class="card"><div class="kpi-label">Saldo do mês</div><div class="kpi-value" style="color:${saldo>=0?'var(--verde)':'var(--vermelho)'}">${fmtMoney(saldo)}</div></div>
      <div class="card"><div class="kpi-label">Ticket médio</div><div class="kpi-value">${fmtMoney(ticketMedio)}</div></div>
    </div>

    <div class="section-block">
      <div class="section-title"><span>Comissões</span><button class="btn btn-sm" id="btnNovaComissao">+ Nova comissão</button></div>
      <div id="comissoesBody"></div>
    </div>
    <div class="section-block">
      <div class="section-title"><span>Receitas</span><button class="btn btn-sm" id="btnNovaReceita">+ Nova receita</button></div>
      <div id="receitasBody"></div>
    </div>
    <div class="section-block">
      <div class="section-title"><span>Despesas</span><button class="btn btn-sm" id="btnNovaDespesa">+ Nova despesa</button></div>
      <div id="despesasBody"></div>
    </div>
  `;

  if(canManageTeam()){
    const fp = document.getElementById('finPills');
    const nomes = isGestor() ? state.usuarios.map(u=>u.nome) : state.usuarios.filter(u=>teamMemberIds().includes(u.id)).map(u=>u.nome);
    fp.innerHTML = ['Todos', ...nomes].map(n=>`<button class="pill ${finCorretorFilter===n?'active':''}" data-n="${n}">${n}</button>`).join('');
    fp.querySelectorAll('.pill').forEach(p=>p.addEventListener('click', ()=>{ finCorretorFilter=p.dataset.n; renderFinanceiro(); }));
  }

  document.getElementById('btnNovaComissao').addEventListener('click', ()=>openComissaoForm());
  document.getElementById('btnNovaReceita').addEventListener('click', ()=>openReceitaDespesaForm('receita'));
  document.getElementById('btnNovaDespesa').addEventListener('click', ()=>openReceitaDespesaForm('despesa'));

  const cBody = document.getElementById('comissoesBody');
  cBody.innerHTML = comissoes.length ? `
    <table><thead><tr><th>Imóvel</th><th>Cliente</th><th>Valor</th><th>%</th><th>Parceiro</th><th>Status</th>${canManageTeam()?'<th>Corretor</th>':''}<th>Data recebim.</th><th></th></tr></thead>
    <tbody>${comissoes.map(cm=>{
      const im = state.imoveis.find(i=>i.id===cm.imovelId);
      const cl = state.clientes.find(c=>c.id===cm.clienteId);
      return `<tr>
        <td>${im?im.codigo:'—'}</td><td>${cl?cl.nome:'—'}</td><td class="mono">${fmtMoney(cm.valor)}</td><td class="mono">${cm.percentual||0}%</td><td>${cm.parceiro||'—'}</td><td>${stamp(cm.status)}</td>${canManageTeam()?`<td>${corretorNome(cm.corretorId)}</td>`:''}<td class="mono">${fmtDate(cm.dataRecebimento)}</td>
        <td style="white-space:nowrap;">
          ${cm.status!=='Recebido'?`<button class="btn-sm btn-outline fin-marcar-recebido" data-id="${cm.id}" title="Marcar como recebido">✓</button>`:''}
          <button class="btn-sm btn-outline fin-editar" data-tipo="comissao" data-id="${cm.id}">✎</button>
          <button class="btn-sm btn-danger fin-excluir" data-tipo="comissoes" data-id="${cm.id}">🗑</button>
        </td>
      </tr>`;
    }).join('')}</tbody></table>
  ` : emptyState('Nenhuma comissão registrada', 'Registre comissões de vendas fechadas.');

  const rBody = document.getElementById('receitasBody');
  rBody.innerHTML = receitas.length ? `
    <table><thead><tr><th>Descrição</th><th>Origem</th><th>Valor</th>${canManageTeam()?'<th>Corretor</th>':''}<th>Data</th><th></th></tr></thead>
    <tbody>${receitas.slice().sort((a,b)=>b.data.localeCompare(a.data)).map(r=>`<tr>
      <td>${r.descricao}</td><td>${r.origem}</td><td class="mono">${fmtMoney(r.valor)}</td>${canManageTeam()?`<td>${corretorNome(r.corretorId)}</td>`:''}<td class="mono">${fmtDate(r.data)}</td>
      <td style="white-space:nowrap;">
        <button class="btn-sm btn-outline fin-editar" data-tipo="receita" data-id="${r.id}">✎</button>
        <button class="btn-sm btn-danger fin-excluir" data-tipo="receitas" data-id="${r.id}">🗑</button>
      </td>
    </tr>`).join('')}</tbody></table>
  ` : emptyState('Nenhuma receita registrada', '');

  const dBody = document.getElementById('despesasBody');
  dBody.innerHTML = despesas.length ? `
    <table><thead><tr><th>Descrição</th><th>Categoria</th><th>Valor</th>${canManageTeam()?'<th>Corretor</th>':''}<th>Data</th><th></th></tr></thead>
    <tbody>${despesas.slice().sort((a,b)=>b.data.localeCompare(a.data)).map(d=>`<tr>
      <td>${d.descricao}</td><td>${d.categoria}</td><td class="mono">${fmtMoney(d.valor)}</td>${canManageTeam()?`<td>${corretorNome(d.corretorId)}</td>`:''}<td class="mono">${fmtDate(d.data)}</td>
      <td style="white-space:nowrap;">
        <button class="btn-sm btn-outline fin-editar" data-tipo="despesa" data-id="${d.id}">✎</button>
        <button class="btn-sm btn-danger fin-excluir" data-tipo="despesas" data-id="${d.id}">🗑</button>
      </td>
    </tr>`).join('')}</tbody></table>
  ` : emptyState('Nenhuma despesa registrada', '');

  // Feature 10: marcar comissão como recebida
  c.querySelectorAll('.fin-marcar-recebido').forEach(btn=>btn.addEventListener('click', ()=>{
    const cm = state.comissoes.find(x=>x.id===btn.dataset.id);
    if(!cm) return;
    cm.status = 'Recebido';
    cm.dataRecebimento = todayISO();
    save(); renderFinanceiro();
    toast('Comissão marcada como recebida.');
  }));

  // Feature 10: editar lançamento existente
  c.querySelectorAll('.fin-editar').forEach(btn=>btn.addEventListener('click', ()=>{
    const tipo = btn.dataset.tipo, id = btn.dataset.id;
    if(tipo==='comissao') openComissaoForm(state.comissoes.find(x=>x.id===id));
    if(tipo==='receita') openReceitaDespesaForm('receita', state.receitas.find(x=>x.id===id));
    if(tipo==='despesa') openReceitaDespesaForm('despesa', state.despesas.find(x=>x.id===id));
  }));

  // Feature 10: excluir lançamento
  c.querySelectorAll('.fin-excluir').forEach(btn=>btn.addEventListener('click', ()=>{
    const tabela = btn.dataset.tipo, id = btn.dataset.id;
    if(!confirm('Excluir este lançamento permanentemente?')) return;
    if(tabela==='comissoes') state.comissoes = state.comissoes.filter(x=>x.id!==id);
    if(tabela==='receitas') state.receitas = state.receitas.filter(x=>x.id!==id);
    if(tabela==='despesas') state.despesas = state.despesas.filter(x=>x.id!==id);
    if(sb) sb.from(tabela).delete().eq('id', id).then(({error})=>{ if(error) console.error(error); });
    save(); renderFinanceiro();
    toast('Lançamento excluído.');
  }));
}

function corretorFieldIfGestor(schema){
  if(canManageTeam()){
    const opts = isGestor() ? state.usuarios.map(u=>u.nome) : state.usuarios.filter(u=>teamMemberIds().includes(u.id)).map(u=>u.nome);
    schema.push({key:'corretorNome', label:'Corretor', type:'select', options: opts});
  }
  return schema;
}
function resolveCorretorId(r){
  if(canManageTeam() && r.corretorNome){
    const u = state.usuarios.find(x=>x.nome===r.corretorNome);
    if(u) return u.id;
  }
  return currentUser().id;
}

function openComissaoForm(existing){
  const imovelOptions = ['(nenhum)', ...state.imoveis.map(i=>i.codigo)];
  const clienteOptions = ['(nenhum)', ...scoped(state.clientes).map(c=>c.nome)];
  const schema = corretorFieldIfGestor([
    {key:'imovelCodigo', label:'Imóvel', type:'select', options:imovelOptions},
    {key:'clienteNome', label:'Cliente', type:'select', options:clienteOptions},
    {key:'valor', label:'Valor (R$)', type:'number'},
    {key:'percentual', label:'Percentual (%)', type:'number'},
    {key:'parceiro', label:'Parceiro (se houver)'},
    {key:'status', label:'Status', type:'select', options:['A receber','Recebido']},
    {key:'dataRecebimento', label:'Data de recebimento', type:'date'}
  ]);
  const imAtual = existing && state.imoveis.find(i=>i.id===existing.imovelId);
  const clAtual = existing && state.clientes.find(c=>c.id===existing.clienteId);
  const data = existing ? Object.assign({}, existing, {imovelCodigo: imAtual?imAtual.codigo:'(nenhum)', clienteNome: clAtual?clAtual.nome:'(nenhum)', corretorNome: corretorNome(existing.corretorId)}) : {status:'A receber', dataRecebimento: todayISO()};
  openModal({
    title: existing ? 'Editar comissão' : 'Nova comissão', schema, data,
    onSave:(r)=>{
      const im = state.imoveis.find(i=>i.codigo===r.imovelCodigo);
      const cl = state.clientes.find(c=>c.nome===r.clienteNome);
      if(existing){
        Object.assign(existing, {imovelId: im?im.id:null, clienteId: cl?cl.id:null, valor:r.valor, percentual:r.percentual, parceiro:r.parceiro, status:r.status, dataRecebimento:r.dataRecebimento, corretorId: resolveCorretorId(r)});
        toast('Comissão atualizada.');
      }else{
        state.comissoes.push({id:uid(), imovelId: im?im.id:null, clienteId: cl?cl.id:null, valor:r.valor, percentual:r.percentual, parceiro:r.parceiro, status:r.status, dataRecebimento:r.dataRecebimento, corretorId: resolveCorretorId(r)});
        toast('Comissão registrada.');
      }
      save(); closeModal(); renderFinanceiro();
    }
  });
}

function openReceitaDespesaForm(kind, existing){
  if(kind==='receita'){
    const schema = corretorFieldIfGestor([{key:'descricao', label:'Descrição'},{key:'origem', label:'Origem'},{key:'valor', label:'Valor (R$)', type:'number'},{key:'data', label:'Data', type:'date'}]);
    const data = existing ? Object.assign({}, existing, {corretorNome: corretorNome(existing.corretorId)}) : {data: todayISO()};
    openModal({
      title: existing ? 'Editar receita' : 'Nova receita', schema, data,
      onSave:(r)=>{
        const corretorId = resolveCorretorId(r); delete r.corretorNome;
        if(existing){ Object.assign(existing, r, {corretorId}); toast('Receita atualizada.'); }
        else{ state.receitas.push(Object.assign({id:uid(), corretorId}, r)); toast('Receita registrada.'); }
        save(); closeModal(); renderFinanceiro();
      }
    });
  }else{
    const schema = corretorFieldIfGestor([{key:'descricao', label:'Descrição'},{key:'categoria', label:'Categoria', type:'select', options:['Marketing','Transporte','Assinaturas','Outros']},{key:'valor', label:'Valor (R$)', type:'number'},{key:'data', label:'Data', type:'date'}]);
    const data = existing ? Object.assign({}, existing, {corretorNome: corretorNome(existing.corretorId)}) : {data: todayISO()};
    openModal({
      title: existing ? 'Editar despesa' : 'Nova despesa', schema, data,
      onSave:(r)=>{
        const corretorId = resolveCorretorId(r); delete r.corretorNome;
        if(existing){ Object.assign(existing, r, {corretorId}); toast('Despesa atualizada.'); }
        else{ state.despesas.push(Object.assign({id:uid(), corretorId}, r)); toast('Despesa registrada.'); }
        save(); closeModal(); renderFinanceiro();
      }
    });
  }
}

/* ============================================================
   RELATÓRIOS
============================================================ */
function renderRelatorios(){
  const c = document.getElementById('content');
  const meta = Number(state.config.meta||0);
  const mesAtual = todayISO().slice(0,7);
  const receitas = scoped(state.receitas), comissoes = scoped(state.comissoes), leads = scoped(state.leads);
  const receitaMes = receitas.filter(r=>r.data.slice(0,7)===mesAtual).reduce((s,r)=>s+Number(r.valor||0),0)
    + comissoes.filter(cm=>cm.status==='Recebido' && cm.dataRecebimento && cm.dataRecebimento.slice(0,7)===mesAtual).reduce((s,cm)=>s+Number(cm.valor||0),0);
  const progresso = meta ? Math.min(100, Math.round(100*receitaMes/meta)) : 0;

  const taxaConv = leads.length ? Math.round(100*leads.filter(l=>l.status==='Fechou').length/leads.length) : 0;
  const fechamentos = leads.filter(l=>l.status==='Fechou').length;
  const ticketMedio = fechamentos ? comissoes.reduce((s,cm)=>s+Number(cm.valor||0),0)/fechamentos : 0;

  const negociando = leads.filter(l=>l.status==='Negociando');
  const projecaoNegociando = negociando.reduce((s,l)=>s + Number(l.orcamento||0)*0.03, 0);

  const origemCount = {};
  leads.forEach(l=>{ origemCount[l.origem] = (origemCount[l.origem]||0)+1; });

  c.innerHTML = `
    <div class="section-block card">
      <div class="section-title">Meta mensal</div>
      <div style="font-size:13px; margin-bottom:8px;">${fmtMoney(receitaMes)} de ${fmtMoney(meta)} (${progresso}%) — edite a meta em Configurações</div>
      <div style="background:var(--paper-2); border-radius:20px; height:10px; overflow:hidden;">
        <div style="background:var(--verde); height:100%; width:${progresso}%;"></div>
      </div>
    </div>

    <div class="grid grid-3 section-block">
      <div class="card"><div class="kpi-label">Taxa de conversão</div><div class="kpi-value">${taxaConv}%</div></div>
      <div class="card"><div class="kpi-label">Ticket médio (comissão)</div><div class="kpi-value">${fmtMoney(ticketMedio)}</div></div>
      <div class="card"><div class="kpi-label">Projeção pipeline</div><div class="kpi-value">${fmtMoney(projecaoNegociando)}</div><div class="kpi-sub">${negociando.length} lead(s) em negociação</div></div>
    </div>

    <div class="section-block">
      <div class="section-title">Leads por origem</div>
      <table><thead><tr><th>Origem</th><th>Quantidade</th></tr></thead>
      <tbody>${Object.keys(origemCount).length ? Object.entries(origemCount).sort((a,b)=>b[1]-a[1]).map(([o,n])=>`<tr><td>${o}</td><td class="mono">${n}</td></tr>`).join('') : '<tr><td colspan="2" style="color:var(--ink-soft);">Sem dados ainda.</td></tr>'}</tbody></table>
    </div>

    <div class="section-block no-print">
      <button class="btn btn-outline" onclick="window.print()">🖨 Imprimir relatório</button>
    </div>
  `;
}

/* ============================================================
   PRODUTOS (empreendimentos / loteamentos)
============================================================ */
function slugify(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}
function formUrlFor(produto){
  const base = window.location.href.replace(/index\.html.*$/,'').replace(/\/$/,'');
  return `${base}/formulario.html?produto=${produto.slug}`;
}

function renderProdutos(){
  const c = document.getElementById('content');
  c.innerHTML = `
    <div class="section-title"><span>Produtos</span>${isGestor()?'<button class="btn btn-sm" id="btnNovoProduto">+ Novo produto</button>':''}</div>
    <p style="font-size:12.5px; color:var(--ink-soft); margin-top:-8px;">Cada produto (empreendimento/loteamento) tem um link de formulário próprio — os leads que chegam por ele já entram automaticamente no CRM, vinculados a esse produto. Configure aqui também as condições padrão de negociação (entrada, prazo e juros) desse loteamento — os lotes novos herdam esses valores automaticamente.</p>
    <div id="produtosBody"></div>
  `;
  if(isGestor()) document.getElementById('btnNovoProduto').addEventListener('click', ()=>openProdutoForm());

  const body = document.getElementById('produtosBody');
  if(!state.produtos.length){
    body.innerHTML = emptyState('Nenhum produto cadastrado', isGestor() ? 'Cadastre seu primeiro empreendimento para gerar o link de captação de leads.' : 'Peça ao Gestor para cadastrar os empreendimentos.');
    return;
  }
  body.innerHTML = `<div class="grid grid-3">${state.produtos.map(p=>{
    const cp = p.condicoesPadrao || condicoesPadraoDefault();
    const numLotes = state.imoveis.filter(i=>i.produtoId===p.id).length;
    return `
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:flex-start;">
        <div>
          <div class="imovel-title">${p.nome}</div>
          <div style="font-size:12px; color:var(--ink-soft);">${p.empresa||''}${p.cidade?' · '+p.cidade:''}</div>
        </div>
        ${stamp(p.ativo?'Ativo':'Inativo')}
      </div>
      ${p.descricao?`<p style="font-size:12.5px; color:var(--ink-soft); margin:8px 0;">${p.descricao}</p>`:''}
      <div style="font-size:11.5px; color:var(--ink-soft); margin:8px 0; padding:8px 10px; background:var(--paper-2); border-radius:4px;">
        💳 Padrão: ${cp.entradaPercent}% entrada · ${cp.meses}x · ${cp.taxaJuros}% a.m.
      </div>
      <div style="font-size:12px; color:var(--ink-soft); margin:6px 0 10px 0;">${numLotes} lote(s) · ${state.leads.filter(l=>l.produtoId===p.id).length} lead(s) recebido(s)</div>
      <div style="display:flex; gap:6px; flex-wrap:wrap;">
        <button class="btn-sm btn-outline copy-link" data-id="${p.id}">🔗 Copiar link do formulário</button>
        ${isGestor()?`<button class="btn-sm btn-outline edit-produto" data-id="${p.id}">Editar</button>`:''}
        ${isGestor()?`<button class="btn-sm btn-danger del-produto" data-id="${p.id}">🗑 Excluir loteamento</button>`:''}
      </div>
    </div>
  `;}).join('')}</div>`;

  body.querySelectorAll('.copy-link').forEach(b=>b.addEventListener('click', async ()=>{
    const p = state.produtos.find(x=>x.id===b.dataset.id);
    const url = formUrlFor(p);
    try{ await navigator.clipboard.writeText(url); toast('Link copiado: '+url); }
    catch(e){ prompt('Copie o link do formulário:', url); }
  }));
  body.querySelectorAll('.edit-produto').forEach(b=>b.addEventListener('click', ()=>{
    openProdutoForm(state.produtos.find(x=>x.id===b.dataset.id));
  }));
  body.querySelectorAll('.del-produto').forEach(b=>b.addEventListener('click', ()=>{
    const p = state.produtos.find(x=>x.id===b.dataset.id);
    if(!p) return;
    const lotesDoProduto = state.imoveis.filter(i=>i.produtoId===p.id);
    const msg = lotesDoProduto.length
      ? `Excluir o loteamento "${p.nome}" e TODOS os ${lotesDoProduto.length} lote(s) vinculados a ele? Essa ação não pode ser desfeita.`
      : `Excluir o loteamento "${p.nome}"? Essa ação não pode ser desfeita.`;
    if(!confirm(msg)) return;
    if(lotesDoProduto.length && !confirm('Confirma novamente: isso apaga permanentemente todos os lotes desse loteamento.')) return;
    const loteIds = lotesDoProduto.map(i=>i.id);
    state.imoveis = state.imoveis.filter(i=>i.produtoId!==p.id);
    state.produtos = state.produtos.filter(x=>x.id!==p.id);
    state.leads.forEach(l=>{
      if(l.produtoId===p.id) l.produtoId = null;
      if(loteIds.includes(l.imovelInteresseId)) l.imovelInteresseId = null;
    });
    if(sb){
      loteIds.forEach(id=> sb.from('imoveis').delete().eq('id', id).then(({error})=>{ if(error) console.error(error); }));
      sb.from('produtos').delete().eq('id', p.id).then(({error})=>{ if(error) console.error(error); });
    }
    save(); renderProdutos();
    toast(`Loteamento excluído${loteIds.length?` junto com ${loteIds.length} lote(s)`:''}.`);
  }));
}

function openProdutoForm(existing){
  const cp = (existing && existing.condicoesPadrao) ? existing.condicoesPadrao : condicoesPadraoDefault();
  let logoAtual = existing ? existing.logo : null;
  openModal({
    title: existing ? 'Editar produto' : 'Novo produto',
    schema:[
      {key:'nome', label:'Nome do empreendimento'},
      {key:'empresa', label:'Empresa/incorporadora'},
      {key:'cidade', label:'Cidade'},
      {key:'descricao', label:'Descrição (aparece no formulário público)', type:'textarea'},
      {key:'ativo', label:'Status', type:'select', options:['Ativo','Inativo']},
      {key:'entradaPercent', label:'Entrada padrão (% do valor do lote)', type:'number'},
      {key:'meses', label:'Prazo padrão (meses)', type:'number'},
      {key:'taxaJuros', label:'Taxa de juros mensal padrão (%)', type:'number', step:'0.01'}
    ],
    data: existing ? Object.assign({}, existing, {ativo: existing.ativo?'Ativo':'Inativo'}, cp) : Object.assign({ativo:'Ativo'}, condicoesPadraoDefault()),
    extraHtml: `
      <p style="font-size:11.5px; color:var(--ink-soft); margin-top:-6px;">Essas condições são o padrão sugerido para os lotes deste loteamento — cada lote continua editável individualmente na sua própria tela.</p>
      <div class="field">
        <label>Logo do empreendimento (aparece no formulário público)</label>
        <div class="logo-edit-wrap">
          <div class="logo-preview" id="produtoLogoPreview">${logoAtual ? `<img src="${logoAtual}">` : '—'}</div>
          <div>
            <input type="file" id="produtoLogoFile" accept="image/*">
            <button type="button" class="btn-sm btn-outline" id="produtoLogoRemove" style="margin-top:6px; ${logoAtual?'':'display:none;'}">Remover logo</button>
          </div>
        </div>
      </div>
    `,
    onSave: async (r)=>{
      const ativo = r.ativo === 'Ativo';
      const condicoesPadrao = {entradaPercent: r.entradaPercent!==undefined&&r.entradaPercent!==''?r.entradaPercent:10, meses: r.meses||80, taxaJuros: r.taxaJuros!==undefined&&r.taxaJuros!==''?r.taxaJuros:0.6};
      if(existing){
        Object.assign(existing, {nome:r.nome, empresa:r.empresa, cidade:r.cidade, descricao:r.descricao, ativo, condicoesPadrao, logo: logoAtual});
        toast('Produto atualizado.');
      }else{
        let slug = slugify(r.nome) || uid();
        if(state.produtos.some(p=>p.slug===slug)) slug = slug + '-' + Math.floor(Math.random()*900+100);
        state.produtos.push({ id:uid(), nome:r.nome, empresa:r.empresa, cidade:r.cidade, descricao:r.descricao, ativo, slug, condicoesPadrao, logo: logoAtual });
        toast('Produto cadastrado.');
      }
      save(); closeModal(); renderProdutos();
    }
  });
  const logoFileInput = document.getElementById('produtoLogoFile');
  if(logoFileInput) logoFileInput.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      logoAtual = reader.result;
      document.getElementById('produtoLogoPreview').innerHTML = `<img src="${logoAtual}">`;
      document.getElementById('produtoLogoRemove').style.display = '';
    };
    reader.readAsDataURL(file);
  });
  const logoRemoveBtn = document.getElementById('produtoLogoRemove');
  if(logoRemoveBtn) logoRemoveBtn.addEventListener('click', ()=>{
    logoAtual = null;
    document.getElementById('produtoLogoPreview').innerHTML = '—';
    logoRemoveBtn.style.display = 'none';
  });
}

/* ============================================================
   EQUIPE (somente Gestor)
============================================================ */
function renderEquipe(){
  const c = document.getElementById('content');
  const mesAtual = todayISO().slice(0,7);
  // Gestor vê todo mundo; Gerente vê só a própria imobiliária (ele + corretores dela)
  const corretores = isGestor() ? state.usuarios : state.usuarios.filter(u=>u.imobiliariaId===currentProfile.imobiliariaId);
  const rows = corretores.map(u=>{
    const leads = state.leads.filter(l=>l.corretorId===u.id);
    const fechados = leads.filter(l=>l.status==='Fechou').length;
    const conv = leads.length ? Math.round(100*fechados/leads.length) : 0;
    const receitaMes = state.receitas.filter(r=>r.corretorId===u.id && r.data.slice(0,7)===mesAtual).reduce((s,r)=>s+Number(r.valor||0),0)
      + state.comissoes.filter(cm=>cm.corretorId===u.id && cm.status==='Recebido' && cm.dataRecebimento && cm.dataRecebimento.slice(0,7)===mesAtual).reduce((s,cm)=>s+Number(cm.valor||0),0);
    const pendentesHoje = state.compromissos.filter(cm=>cm.corretorId===u.id && cm.data===todayISO() && cm.status==='Pendente').length;
    return {u, leads: leads.length, fechados, conv, receitaMes, pendentesHoje};
  });

  c.innerHTML = `
    <div class="section-title"><span>${isGestor()?'Equipe':'Minha equipe'}</span><button class="btn btn-sm" id="btnNovoCorretor">+ Adicionar ${isGestor()?'membro':'corretor'}</button></div>
    ${isGerente()?`<p style="font-size:12.5px; color:var(--ink-soft); margin-top:-8px;">Você vê e gerencia apenas os corretores da sua imobiliária.</p>`:''}
    <div class="section-block">
      ${rows.length ? `
        <table><thead><tr><th>Nome</th><th>Papel</th>${isGestor()?'<th>Imobiliária</th>':''}<th>Leads</th><th>Fechados</th><th>Conversão</th><th>Receita do mês</th><th>Compromissos hoje</th><th></th></tr></thead>
        <tbody>${rows.map(r=>`
          <tr>
            <td style="font-weight:600;">${r.u.nome}${r.u.creci?` <span style="font-weight:400; color:var(--ink-soft); font-size:11px;">CRECI ${r.u.creci}</span>`:''}</td>
            <td><span class="stamp ${r.u.papel==='Gestor'?'s-vermelho':r.u.papel==='Gerente'?'s-azul':'s-ink'}">${r.u.papel}</span></td>
            ${isGestor()?`<td style="font-size:12px;">${r.u.imobiliariaId?imobiliariaNome(r.u.imobiliariaId):'—'}</td>`:''}
            <td class="mono">${r.leads}</td>
            <td class="mono">${r.fechados}</td>
            <td class="mono">${r.conv}%</td>
            <td class="mono">${fmtMoney(r.receitaMes)}</td>
            <td class="mono">${r.pendentesHoje}</td>
            <td style="display:flex; gap:6px; flex-wrap:wrap;">${r.u.id!==currentUser().id ? `
              <button class="btn-sm btn-outline user-edit" data-id="${r.u.id}">Editar</button>
              <button class="btn-sm btn-outline user-setpw" data-id="${r.u.id}" data-nome="${r.u.nome}">🔑 Definir senha</button>
              ${(isGestor() && r.u.papel!=='Gestor') || (isGerente() && r.u.papel==='Corretor') ? `<button class="btn-sm btn-danger user-del" data-id="${r.u.id}">Remover</button>` : ''}
            ` : '<span style="font-size:11px; color:var(--ink-soft);">você</span>'}</td>
          </tr>
        `).join('')}</tbody></table>
      ` : emptyState('Nenhum membro cadastrado', isGestor()?'Adicione gestores, gerentes ou corretores.':'Adicione corretores para sua imobiliária.')}
    </div>
  `;
  document.getElementById('btnNovoCorretor').addEventListener('click', ()=>openUsuarioForm());
  c.querySelectorAll('.user-edit').forEach(b=>b.addEventListener('click', ()=>{
    openUsuarioForm(state.usuarios.find(u=>u.id===b.dataset.id));
  }));
  c.querySelectorAll('.user-setpw').forEach(b=>b.addEventListener('click', ()=>{
    openSetPasswordForm(b.dataset.id, b.dataset.nome);
  }));
  c.querySelectorAll('.user-del').forEach(b=>b.addEventListener('click', async ()=>{
    const alvo = state.usuarios.find(u=>u.id===b.dataset.id);
    if(!alvo) return;
    if(!confirm(`Remover "${alvo.nome}" do sistema? O login dele será excluído permanentemente.`)) return;
    const { data: sessionData } = await sb.auth.getSession();
    const resp = await fetch(`${SUPABASE_URL}/functions/v1/delete-user`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization': `Bearer ${sessionData.session.access_token}` },
      body: JSON.stringify({ userId: alvo.id })
    });
    const out = await resp.json();
    if(!resp.ok){ alert('Erro ao remover: ' + (out.error||'tente novamente.')); return; }
    state.usuarios = state.usuarios.filter(u=>u.id!==alvo.id);
    toast('Membro removido.');
    renderEquipe();
  }));
}

function openSetPasswordForm(userId, nome){
  openModal({
    title: `Definir senha para ${nome}`,
    schema: [{key:'novaSenha', label:'Nova senha (mín. 6 caracteres)', type:'password'}],
    data: {},
    extraHtml: `<p style="font-size:11.5px; color:var(--ink-soft); margin-top:-6px;">Isso troca a senha de acesso dessa pessoa imediatamente, sem precisar de e-mail. Avise a pessoa da nova senha por WhatsApp ou pessoalmente.</p>`,
    onSave: async (r)=>{
      if(!r.novaSenha || r.novaSenha.length<6){ alert('A senha precisa ter pelo menos 6 caracteres.'); return; }
      const { data: sessionData } = await sb.auth.getSession();
      const resp = await fetch(`${SUPABASE_URL}/functions/v1/admin-set-password`, {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'Authorization': `Bearer ${sessionData.session.access_token}` },
        body: JSON.stringify({ userId, newPassword: r.novaSenha })
      });
      const out = await resp.json();
      if(!resp.ok){ alert('Erro ao definir senha: ' + (out.error||'tente novamente.')); return; }
      toast('Senha definida com sucesso.');
      closeModal();
    }
  });
}

function openUsuarioForm(existing){
  const isNewCorretorOnly = !isGestor(); // Gerente só cadastra Corretor
  const papelOptions = isNewCorretorOnly ? ['Corretor'] : ['Corretor','Gerente','Gestor'];
  const imobiliariaOptions = ['(nenhuma)', ...state.imobiliarias.map(m=>m.nome)];

  if(existing){
    const imobAtual = state.imobiliarias.find(m=>m.id===existing.imobiliariaId);
    openModal({
      title: 'Editar membro',
      schema:[
        {key:'nome', label:'Nome completo'},
        {key:'papel', label:'Papel', type:'select', options: isGestor()?['Corretor','Gerente','Gestor']:['Corretor']},
        {key:'telefone', label:'Telefone'},
        {key:'creci', label:'CRECI'},
        {key:'imobiliariaNome', label:'Imobiliária', type:'select', options: imobiliariaOptions}
      ],
      data: Object.assign({}, existing, {imobiliariaNome: imobAtual?imobAtual.nome:'(nenhuma)'}),
      extraHtml: `<p style="font-size:11.5px; color:var(--ink-soft);">Para excluir o acesso, use o botão "Remover" na lista da Equipe.</p>`,
      onSave: async (r)=>{
        const imobSel = state.imobiliarias.find(m=>m.nome===r.imobiliariaNome);
        const imobiliariaId = imobSel ? imobSel.id : null;
        const { error } = await sb.from('profiles').update({nome:r.nome, papel:r.papel, telefone:r.telefone, creci:r.creci, imobiliaria_id: imobiliariaId}).eq('id', existing.id);
        if(error){ alert('Erro ao salvar: '+error.message); return; }
        Object.assign(existing, {nome:r.nome, papel:r.papel, telefone:r.telefone, creci:r.creci, imobiliariaId});
        toast('Membro atualizado.');
        closeModal(); renderEquipe();
      }
    });
    return;
  }

  openModal({
    title: isGestor() ? 'Adicionar membro' : 'Adicionar corretor',
    schema:[
      {key:'nome', label:'Nome completo'},
      {key:'email', label:'E-mail'},
      {key:'telefone', label:'Telefone'},
      {key:'creci', label:'CRECI'},
      {key:'papel', label:'Papel', type:'select', options: papelOptions},
      {key:'imobiliariaNome', label:'Imobiliária', type:'select', options: imobiliariaOptions}
    ],
    data: {papel:'Corretor', imobiliariaNome: isGerente() ? imobiliariaNome(currentProfile.imobiliariaId) : '(nenhuma)'},
    extraHtml: `<p style="font-size:11.5px; color:var(--ink-soft);">A pessoa recebe um e-mail de convite e define a própria senha com segurança.${isGerente()?' Corretores adicionados por você entram automaticamente na sua imobiliária.':''}</p><div id="corretoresDaImobiliaria" style="font-size:12px; color:var(--ink-soft); margin-top:6px;"></div>`,
    onSave: async (r)=>{
      if(!r.email || !r.email.includes('@')){ alert('Informe um e-mail válido.'); return; }
      const imobSel = state.imobiliarias.find(m=>m.nome===r.imobiliariaNome);
      const imobiliariaId = isGerente() ? currentProfile.imobiliariaId : (imobSel ? imobSel.id : null);
      const { data: sessionData } = await sb.auth.getSession();
      const resp = await fetch(`${SUPABASE_URL}/functions/v1/invite-user`, {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'Authorization': `Bearer ${sessionData.session.access_token}` },
        body: JSON.stringify({ email:r.email, nome:r.nome, papel:r.papel, telefone:r.telefone, creci:r.creci, imobiliariaId })
      });
      const out = await resp.json();
      if(!resp.ok){ alert('Erro ao convidar: ' + (out.error||'tente novamente.')); return; }
      toast('Convite enviado por e-mail para ' + r.email + '.');
      closeModal();
      const { data: profR } = await sb.from('profiles').select('*');
      state.usuarios = (profR||[]).map(p=>({id:p.id, nome:p.nome, papel:p.papel, telefone:p.telefone, creci:p.creci, imobiliariaId:p.imobiliaria_id, disponivelRoleta:!!p.disponivel_roleta}));
      renderEquipe();
    }
  });

  // Ao escolher a imobiliária no formulário, mostra os corretores já cadastrados nela
  if(isGestor()){
    const selImob = document.getElementById('ff_imobiliariaNome');
    const infoBox = document.getElementById('corretoresDaImobiliaria');
    function atualizaInfo(){
      const m = state.imobiliarias.find(x=>x.nome===selImob.value);
      if(!m){ infoBox.textContent=''; return; }
      const membros = state.usuarios.filter(u=>u.imobiliariaId===m.id);
      infoBox.textContent = membros.length ? `Já cadastrados nessa imobiliária: ${membros.map(u=>u.nome).join(', ')}` : 'Nenhum corretor cadastrado ainda nessa imobiliária.';
    }
    if(selImob){ selImob.addEventListener('change', atualizaInfo); atualizaInfo(); }
  }
}

/* ============================================================
   IMOBILIÁRIAS (empresas parceiras que usam o CRM — somente Gestor)
============================================================ */
function renderImobiliarias(){
  const c = document.getElementById('content');
  c.innerHTML = `
    <div class="section-title"><span>Imobiliárias</span><button class="btn btn-sm" id="btnNovaImobiliaria">+ Nova imobiliária</button></div>
    <p style="font-size:12.5px; color:var(--ink-soft); margin-top:-8px;">Cadastre imobiliárias parceiras que vão usar este CRM. Cada uma pode ter um gerente e uma equipe de corretores próprios.</p>
    <div id="imobiliariasBody"></div>
  `;
  document.getElementById('btnNovaImobiliaria').addEventListener('click', ()=>openImobiliariaForm());
  const body = document.getElementById('imobiliariasBody');
  if(!state.imobiliarias.length){
    body.innerHTML = emptyState('Nenhuma imobiliária cadastrada', 'Cadastre a primeira imobiliária parceira.');
    return;
  }
  body.innerHTML = `<div class="grid grid-3">${state.imobiliarias.map(m=>{
    const membros = state.usuarios.filter(u=>u.imobiliariaId===m.id);
    const gerente = membros.find(u=>u.papel==='Gerente');
    return `
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:flex-start;">
        <div class="imovel-title">${m.nome}</div>
        ${stamp(m.ativo?'Ativo':'Inativo')}
      </div>
      <div style="font-size:12px; color:var(--ink-soft); margin:4px 0;">${m.cnpj?`CNPJ ${m.cnpj}`:''}${m.creciJuridico?` · CRECI-J ${m.creciJuridico}`:''}</div>
      ${m.endereco?`<div style="font-size:12px; color:var(--ink-soft);">${m.endereco}</div>`:''}
      <div style="font-size:12.5px; margin:8px 0;"><b>Gerente:</b> ${gerente?gerente.nome:'—'}</div>
      <div style="font-size:12px; color:var(--ink-soft); margin-bottom:10px;">${membros.length} membro(s) cadastrado(s)${membros.length?`: ${membros.map(u=>u.nome).join(', ')}`:''}</div>
      <div style="display:flex; gap:6px; flex-wrap:wrap;">
        <button class="btn-sm btn-outline edit-imob" data-id="${m.id}">Editar</button>
        <button class="btn-sm btn-danger del-imob" data-id="${m.id}">🗑 Excluir</button>
      </div>
    </div>
  `;}).join('')}</div>`;
  body.querySelectorAll('.edit-imob').forEach(b=>b.addEventListener('click', ()=>{
    openImobiliariaForm(state.imobiliarias.find(x=>x.id===b.dataset.id));
  }));
  body.querySelectorAll('.del-imob').forEach(b=>b.addEventListener('click', ()=>{
    const m = state.imobiliarias.find(x=>x.id===b.dataset.id);
    if(!m) return;
    const membros = state.usuarios.filter(u=>u.imobiliariaId===m.id);
    if(membros.length){ alert(`Não é possível excluir: existem ${membros.length} corretor(es)/gerente(s) vinculados a essa imobiliária. Remova-os primeiro em Equipe.`); return; }
    if(!confirm(`Excluir a imobiliária "${m.nome}"?`)) return;
    state.imobiliarias = state.imobiliarias.filter(x=>x.id!==m.id);
    if(sb) sb.from('imobiliarias').delete().eq('id', m.id).then(({error})=>{ if(error) console.error(error); });
    save(); renderImobiliarias();
    toast('Imobiliária excluída.');
  }));
}

function openImobiliariaForm(existing){
  openModal({
    title: existing ? 'Editar imobiliária' : 'Nova imobiliária',
    schema:[
      {key:'nome', label:'Nome da imobiliária'},
      {key:'cnpj', label:'CNPJ'},
      {key:'creciJuridico', label:'CRECI jurídico (PJ)'},
      {key:'endereco', label:'Endereço'},
      {key:'telefone', label:'Telefone'},
      {key:'email', label:'E-mail'},
      {key:'observacoes', label:'Observações legais / anotações', type:'textarea'},
      {key:'ativo', label:'Status', type:'select', options:['Ativo','Inativo']}
    ],
    data: existing ? Object.assign({}, existing, {ativo: existing.ativo?'Ativo':'Inativo'}) : {ativo:'Ativo'},
    onSave: (r)=>{
      const ativo = r.ativo === 'Ativo';
      if(existing){
        Object.assign(existing, {nome:r.nome, cnpj:r.cnpj, creciJuridico:r.creciJuridico, endereco:r.endereco, telefone:r.telefone, email:r.email, observacoes:r.observacoes, ativo});
        toast('Imobiliária atualizada.');
      }else{
        state.imobiliarias.push({ id:uid(), nome:r.nome, cnpj:r.cnpj, creciJuridico:r.creciJuridico, endereco:r.endereco, telefone:r.telefone, email:r.email, observacoes:r.observacoes, ativo });
        toast('Imobiliária cadastrada.');
      }
      save(); closeModal(); renderImobiliarias();
    }
  });
}

/* ============================================================
   ROLETA DE LEADS (distribuição automática — somente Gestor configura)
============================================================ */
async function saveRoletaConfig(){
  if(!sb) return;
  const { error } = await sb.from('roleta_config').upsert([{
    id: 'default',
    participantes: state.roletaConfig.participantes,
    ativa: state.roletaConfig.ativa,
    prazo_minutos: state.roletaConfig.prazoMinutos
  }], {onConflict:'id'});
  if(error){ console.error(error); toast('Erro ao salvar a roleta.'); return false; }
  return true;
}

function renderRoleta(){
  const c = document.getElementById('content');
  const corretores = state.usuarios.filter(u=>u.papel==='Corretor' || u.papel==='Gerente');
  const participantesSet = new Set(state.roletaConfig.participantes||[]);

  c.innerHTML = `
    <p style="font-size:12.5px; color:var(--ink-soft); margin-top:-8px; max-width:640px;">
      Quando um lead chega sem corretor definido (ex: pelo formulário do site), o sistema atribui automaticamente ao próximo corretor disponível da lista abaixo, em rodízio. Se o corretor não registrar nenhum contato em <b>${state.roletaConfig.prazoMinutos} minutos</b>, o lead passa sozinho para o próximo da fila.
    </p>

    <div class="card section-block" style="max-width:640px;">
      <div class="field">
        <label>Roleta ativa</label>
        <select id="roletaAtiva">
          <option value="sim" ${state.roletaConfig.ativa?'selected':''}>Sim — distribuir leads automaticamente</option>
          <option value="nao" ${!state.roletaConfig.ativa?'selected':''}>Não — atribuição automática desligada</option>
        </select>
      </div>
      <div class="field">
        <label>Prazo para o corretor atender (minutos)</label>
        <input type="number" id="roletaPrazo" value="${state.roletaConfig.prazoMinutos}" min="1">
      </div>
      <button class="btn btn-sm" id="btnSalvarRoletaCfg">Salvar configuração</button>
    </div>

    <div class="section-title">Corretores na roleta</div>
    <p style="font-size:12.5px; color:var(--ink-soft); margin-top:-10px;">Marque quem participa do rodízio. Cada corretor também precisa se marcar como "Disponível" (em Configurações) para receber leads — assim ele controla quando está online.</p>
    <div class="card section-block" style="max-width:640px;">
      ${corretores.length ? corretores.map(u=>`
        <label style="display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line);">
          <input type="checkbox" class="roleta-participante" data-id="${u.id}" ${participantesSet.has(u.id)?'checked':''} style="width:18px; height:18px;">
          <span style="flex:1;">${u.nome}</span>
          <span class="stamp ${u.disponivelRoleta?'s-verde':'s-ink'}">${u.disponivelRoleta?'Disponível agora':'Offline'}</span>
        </label>
      `).join('') : emptyState('Nenhum corretor cadastrado', 'Cadastre corretores em Equipe primeiro.')}
    </div>
  `;

  document.getElementById('btnSalvarRoletaCfg').addEventListener('click', async ()=>{
    state.roletaConfig.ativa = document.getElementById('roletaAtiva').value === 'sim';
    state.roletaConfig.prazoMinutos = parseInt(document.getElementById('roletaPrazo').value)||20;
    const ok = await saveRoletaConfig();
    if(ok) toast('Configuração da roleta salva.');
  });

  c.querySelectorAll('.roleta-participante').forEach(cb=>cb.addEventListener('change', async ()=>{
    const id = cb.dataset.id;
    const set = new Set(state.roletaConfig.participantes||[]);
    if(cb.checked) set.add(id); else set.delete(id);
    state.roletaConfig.participantes = Array.from(set);
    const ok = await saveRoletaConfig();
    if(ok) toast(cb.checked ? 'Corretor adicionado à roleta.' : 'Corretor removido da roleta.');
  }));
}



/* ============================================================
   CONFIGURAÇÕES
============================================================ */
function renderConfig(){
  const c = document.getElementById('content');
  const t = state.config.theme || defaultTheme();
  c.innerHTML = `
    ${isGestor() ? `
    <div class="section-title">Identidade do sistema</div>
    <div class="card section-block" style="max-width:560px;">
      <div class="field">
        <label>Nome do sistema</label>
        <input type="text" id="cfgNome" value="${state.config.nome||''}">
      </div>
      <div class="field">
        <label>Logo</label>

          <div>
            <input type="file" id="cfgLogoFile" accept="image/*">

      </div>
      <div class="field">

      </div>
      <div class="field">
        <label>Cidades de atuação</label>
        <input type="text" id="cfgCidades" value="${state.config.cidades||''}">
      </div>
      <div class="field">
        <label>Meta mensal (R$)</label>
        <input type="number" id="cfgMeta" value="${state.config.meta||0}">
      </div>
      <button class="btn" id="btnSalvarCfg">Salvar identidade</button>
    </div>

    <div class="section-title">Cores do sistema</div>
    <div class="card section-block" style="max-width:560px;">
      <p style="font-size:12px; color:var(--ink-soft); margin-top:0;">Ajuste a paleta usada em todo o sistema. As variações mais claras/escuras são geradas automaticamente.</p>
      <div class="color-grid">
        <div class="field"><label>Fundo (papel)</label><input type="color" id="thPaper" value="${t.paper}"></div>
        <div class="field"><label>Texto / barra lateral</label><input type="color" id="thInk" value="${t.ink}"></div>
        <div class="field"><label>Verde (positivo)</label><input type="color" id="thVerde" value="${t.verde}"></div>
        <div class="field"><label>Vermelho (alerta)</label><input type="color" id="thVermelho" value="${t.vermelho}"></div>
        <div class="field"><label>Latão (destaque)</label><input type="color" id="thLatao" value="${t.latao}"></div>
        <div class="field"><label>Azul (informativo)</label><input type="color" id="thAzul" value="${t.azul}"></div>
      </div>
      <div style="display:flex; gap:8px; margin-top:6px;">
        <button class="btn btn-sm" id="btnSalvarCores">Aplicar cores</button>
        <button class="btn btn-outline btn-sm" id="btnResetCores">Restaurar padrão</button>
      </div>
    </div>
    ` : ''}

    <div class="section-title">Minha conta</div>
    <div class="card section-block" style="max-width:560px;">
      <p style="font-size:12.5px; color:var(--ink-soft); margin-top:0;">Logada como <b>${sessionUser?sessionUser.email:''}</b> (${currentUser().papel}).</p>
      <div class="field">
        <label>Foto de perfil</label>
        <div class="logo-edit-wrap">
          <div class="logo-preview" id="avatarPreview">${currentProfile.avatarUrl ? `<img src="${currentProfile.avatarUrl}">` : currentProfile.nome.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase()}</div>
          <div>
            <input type="file" id="cfgAvatarFile" accept="image/*">
            ${currentProfile.avatarUrl ? '<button class="btn-sm btn-outline" id="cfgAvatarRemove" style="margin-top:6px;">Remover foto</button>' : ''}
          </div>
        </div>
      </div>
      <div class="field"><label>Nova senha</label><input type="password" id="cfgNovaSenha" minlength="6" placeholder="mín. 6 caracteres"></div>
      <button class="btn btn-sm" id="btnTrocarSenha">Trocar senha</button>
    </div>

    <div class="section-title">Roleta de leads</div>
    <div class="card section-block" style="max-width:560px;">
      <p style="font-size:12.5px; color:var(--ink-soft); margin-top:0;">
        Ative para receber leads novos automaticamente pela roleta (se o Gestor te incluiu nela). Desative quando não estiver atendendo.
      </p>
      <label style="display:flex; align-items:center; gap:10px; cursor:pointer;">
        <input type="checkbox" id="cfgDisponivelRoleta" ${currentProfile.disponivelRoleta?'checked':''} style="width:20px; height:20px;">
        <span>${currentProfile.disponivelRoleta ? 'Disponível — recebendo leads da roleta' : 'Offline — não vou receber leads da roleta'}</span>
      </label>
    </div>

    <div class="section-title">Notificações e app no celular</div>
    <div class="card section-block" style="max-width:560px;">
      <p style="font-size:12.5px; color:var(--ink-soft); margin-top:0;">
        Ative os avisos de agenda — agora chegam como notificação de verdade no celular, mesmo com o app fechado.
        Status atual: <b>${('Notification' in window) ? ({granted:'ativado ✅', denied:'bloqueado ⛔ (mude nas configurações do navegador)', default:'não ativado'}[Notification.permission]) : 'não suportado neste navegador'}</b>
      </p>
      <button class="btn btn-sm" id="btnAtivarNotif">🔔 Ativar notificações</button>
      <p style="font-size:12.5px; color:var(--ink-soft); margin-top:14px;">
        <b>Instalar como app no celular:</b> abra este site pelo navegador do celular (Chrome no Android, Safari no iPhone) e toque em
        <b>"Adicionar à tela inicial"</b> (iPhone: botão de compartilhar → Adicionar à Tela de Início · Android: menu ⋮ → Instalar app / Adicionar à tela inicial).
        Isso cria um ícone que abre o sistema em tela cheia, como um app de verdade.

    ${isGestor() ? `
    <div class="section-title">Dados</div>
    <div class="card section-block" style="max-width:560px;">
      <p style="font-size:12.5px; color:var(--ink-soft); margin-top:0;">Os dados ficam no banco (Supabase) e sincronizam em qualquer aparelho onde você fizer login. Use exportar/importar para backup ou migração.</p>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn btn-outline" id="btnExport2">⇩ Exportar dados</button>
        <button class="btn btn-outline" id="btnImport2">⇧ Importar dados</button>

      </div>
    </div>
    ` : ''}
  `;

  document.getElementById('btnAtivarNotif').addEventListener('click', ()=>{
    requestNotifPermission();
    setTimeout(()=>renderConfig(), 300);
  });

  document.getElementById('btnTrocarSenha').addEventListener('click', async ()=>{
    const pw = document.getElementById('cfgNovaSenha').value;
    if(!pw || pw.length<6){ alert('A senha precisa ter pelo menos 6 caracteres.'); return; }
    const { error } = await sb.auth.updateUser({ password: pw });
    if(error){ alert('Erro ao trocar senha: '+error.message); return; }
    toast('Senha alterada com sucesso.');
    document.getElementById('cfgNovaSenha').value='';
  });

  document.getElementById('cfgDisponivelRoleta').addEventListener('change', async (e)=>{
    const val = e.target.checked;
    const { error } = await sb.from('profiles').update({ disponivel_roleta: val }).eq('id', currentProfile.id);
    if(error){ alert('Erro ao atualizar disponibilidade: '+error.message); e.target.checked = !val; return; }
    currentProfile.disponivelRoleta = val;
    const u = state.usuarios.find(x=>x.id===currentProfile.id);
    if(u) u.disponivelRoleta = val;
    toast(val ? 'Você está disponível para a roleta de leads.' : 'Você ficou offline na roleta de leads.');
    renderConfig();

  document.getElementById('cfgLogoFile') && document.getElementById('cfgLogoFile').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      state.config.logo = reader.result;
      save(); renderConfig(); renderBrand();
      toast('Logo atualizada.');
    };
    reader.readAsDataURL(file);
  });
  const removeBtn = document.getElementById('cfgLogoRemove');
  if(removeBtn) removeBtn.addEventListener('click', ()=>{ state.config.logo=null; save(); renderConfig(); renderBrand(); });

  document.getElementById('cfgAvatarFile') && document.getElementById('cfgAvatarFile').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async ()=>{
      const dataUrl = reader.result;
      const { error } = await sb.from('profiles').update({ avatar_url: dataUrl }).eq('id', currentProfile.id);
      if(error){ alert('Erro ao salvar foto: '+error.message); return; }
      currentProfile.avatarUrl = dataUrl;

      toast('Foto de perfil atualizada.');

    currentProfile.avatarUrl = null;

    if(u) u.avatarUrl = null;
    renderConfig(); renderNav();

    state.config.cidades = document.getElementById('cfgCidades').value.trim();
    state.config.meta = parseFloat(document.getElementById('cfgMeta').value)||0;

    toast('Identidade salva.');
  });

  const btnSalvarCores = document.getElementById('btnSalvarCores');
  if(btnSalvarCores) btnSalvarCores.addEventListener('click', ()=>{
    state.config.theme = {
      paper: document.getElementById('thPaper').value,

      azul: document.getElementById('thAzul').value

  });
  const btnResetCores = document.getElementById('btnResetCores');
  if(btnResetCores) btnResetCores.addEventListener('click', ()=>{
    state.config.theme = defaultTheme();
    save(); applyTheme(); renderConfig();

  const btnExport2 = document.getElementById('btnExport2');
  if(btnExport2) btnExport2.addEventListener('click', exportData);
  const btnImport2 = document.getElementById('btnImport2');
  if(btnImport2) btnImport2.addEventListener('click', ()=>document.getElementById('fileImport').click());
  const btnLimpar = document.getElementById('btnLimpar');
  if(btnLimpar) btnLimpar.addEventListener('click', ()=>{
    if(!confirm('Isso apaga TODOS os leads, clientes, imóveis, agenda e financeiro. Tem certeza?')) return;

    Promise.all(Object.entries(tables).flatMap(([table, rows])=> rows.map(r=> sb.from(table).delete().eq('id', r.id))))
      .then(()=>{
        const cfg = state.config, usuarios = state.usuarios;
        state = defaultState();
        state.config = cfg; state.usuarios = usuarios;
        renderAll();
        toast('Dados limpos.');
      });
  });
}

/* ============================================================
   EXPORT / IMPORT
============================================================ */
function exportData(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${(state.config.nome||'imobicrm').toLowerCase().replace(/\s+/g,'-')}-dados-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Dados exportados.');
}

function importDataFile(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      ['leads','clientes','imoveis','compromissos','comissoes','despesas','receitas'].forEach(k=>{
        if(Array.isArray(parsed[k])) state[k] = parsed[k];
      });
      save(); renderAll();
      toast('Dados importados e sincronizados com o banco.');
    }catch(e){
      alert('Arquivo inválido. Verifique se é um JSON exportado pelo ImobiCRM.');
    }
  };
  reader.readAsText(file);
}

document.getElementById('btnExport').addEventListener('click', exportData);
document.getElementById('btnImport').addEventListener('click', ()=>document.getElementById('fileImport').click());
document.getElementById('fileImport').addEventListener('change', (e)=>{
  if(e.target.files[0]) importDataFile(e.target.files[0]);
  e.target.value = '';
});
document.getElementById('btnTrocarUsuario').addEventListener('click', async ()=>{
  await sb.auth.signOut();
});

/* Menu mobile (off-canvas) */
function closeSidebar(){
  document.querySelector('.sidebar').classList.remove('open');
  document.getElementById('sidebarBackdrop').classList.remove('open');
}
document.getElementById('hamburgerBtn').addEventListener('click', ()=>{
  document.querySelector('.sidebar').classList.toggle('open');
  document.getElementById('sidebarBackdrop').classList.toggle('open');
});
document.getElementById('sidebarBackdrop').addEventListener('click', closeSidebar);

/* ============================================================
   INIT
============================================================ */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
boot();
</script>
